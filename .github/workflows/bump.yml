name: bump

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app-templates

      - uses: actions/checkout@v4
        with:
          repository: hivepaas/hivepaas
          # HivePaaS as the next release will be, as in lint.yml: a pull request it
          # opens is linted by the same code, and by every supported release there.
          ref: main
          path: hivepaas

      - uses: actions/setup-go@v5
        with:
          go-version-file: hivepaas/go.mod
          cache-dependency-path: hivepaas/go.sum

      - name: Bump pinned images
        working-directory: hivepaas
        run: go run ./tools/apptemplate bump ../app-templates

      # The stars the store orders by, and those of the last four weeks. The job's
      # own token reads the stars; who starred when - what Trending counts - may
      # need a token of a person or a GitHub App, as the STATS_GITHUB_TOKEN secret
      # (read-only, public repositories only). Without one, Trending stays empty.
      # A count that fails costs the stars, not the week's image bumps.
      - name: Count stars
        working-directory: hivepaas
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: go run ./tools/apptemplate stats ../app-templates

      # The pull request is opened with GITHUB_TOKEN, and GitHub does not run
      # workflows on what that token pushes - so lint runs here instead of waiting
      # for a check that will never start.
      - name: Lint what was produced
        working-directory: hivepaas
        run: |
          go run ./tools/apptemplate lint ../app-templates
          go run ./tools/apptemplate index -check ../app-templates

      - name: Open a pull request
        working-directory: app-templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "every template is current"
            exit 0
          fi
          branch="bump/$(date -u +%Y-%m-%d)"
          git config user.name "hivepaas-bot"
          git config user.email "bot@hivepaas.com"
          git checkout -b "$branch"
          git commit -am "Bump pinned images and count stars"
          git push -u origin "$branch"
          gh pr create --fill --title "Bump pinned images and count stars" \
            --body "Opened by the scheduled bump job. Each version line moved to the newest release every variant publishes, within the line the template declares, and stats.yaml has this week's GitHub stars."
