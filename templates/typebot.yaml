apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: typebot
  title: Typebot
  tagline: Build chatbots and conversational forms visually, embed them anywhere
  description: |
    Typebot builds chatbots and conversational forms on a canvas: text, choices, inputs,
    conditions, variables, webhooks, OpenAI and other integrations, then embeds them in a
    website as a bubble, a popup or inline, or shares them as a page - with results and
    analytics per bot.

    **This template creates three apps**

    - **Typebot**, as three components: the builder, where bots are made, the viewer,
      where people chat with them - each on a domain of its own - and an nginx in front,
      which the two domains point at and which sends each to its component
    - **a PostgreSQL database**, named after the app with `-db` added
    - **a Redis**, named after the app with `-cache` added

    **Both domains are needed**

    Typebot does not start without the builder's and the viewer's addresses: give both
    below. They are the gateway's two domains; to change the viewer's later, change it in
    the gateway's routing settings, in its `default.conf`, and in `NEXT_PUBLIC_VIEWER_URL`
    on the builder and the viewer.

    **Signing in: a link by email**

    Typebot has no passwords: it emails a sign-in link, through the SMTP server below.
    Sign-up is closed; the administrator email below can still sign in, and gets an
    unlimited workspace. Invite others from a workspace's members.

    **File uploads**

    File inputs and image uploads need an S3 bucket, set with the `S3_*` environment
    variables on both components; Typebot's
    [configuration reference](https://docs.typebot.io/self-hosting/configuration) lists them.
  categories: [webapps/low-code]
  tags: [low-code, chat, automation]
  aliases: [chatbot builder, conversational forms, typeform alternative, landbot alternative, whatsapp bot, forms]
  icon: icons/typebot.svg
  links:
    website: https://typebot.io
    documentation: https://docs.typebot.io/self-hosting/deploy/docker
    source: https://github.com/baptisteArno/typebot.io
  # The Functional Source License: free to self-host, not to offer as a competing
  # service; each release becomes Apache 2.0 two years after it is published.
  license: FSL-1.1-Apache-2.0
  requires:
    versionCode: v000001

parameters:
  - name: domain
    title: Builder domain
    description: >-
      Where the builder answers - `typebot.example.com`. Typebot does not start without it.
    type: domain
    optional: true
  - name: viewerDomain
    title: Viewer domain
    description: >-
      Where people chat with the bots - `bot.example.com`. Typebot does not start without it.
    type: domain
    optional: true
  - name: adminEmail
    title: Administrator email
    description: The address that can sign in with sign-up closed, and gets an unlimited workspace.
    type: string
    default: admin@example.com
    pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  - name: smtpHost
    title: SMTP host
    description: Sign-in links are sent through it.
    type: string
    default: smtp.example.com
  - name: smtpPort
    title: SMTP port
    type: int
    default: 465
    min: 1
    max: 65535
  - name: smtpSecure
    title: SMTP TLS
    type: select
    default: "true"
    options:
      - {value: "true", title: "TLS from the first byte (usually port 465)"}
      - {value: "false", title: "STARTTLS or none (usually port 587)"}
  - name: smtpUser
    title: SMTP username
    type: string
    optional: true
  - name: smtpPassword
    title: SMTP password
    type: secret
    optional: true
  - name: smtpFrom
    title: Sender
    description: The name and address emails come from.
    type: string
    default: "Typebot <noreply@example.com>"
  - name: encryptionSecret
    title: Encryption secret
    description: >-
      Encrypts the credentials bots use, 32 characters. Leave empty to generate one, and keep
      it with the backups.
    type: secret
    minLength: 32
    maxLength: 32
    generate: {length: 32}

dependencies:
  - name: db
    title: Database
    template: postgres
    version: "17"
    params:
      dbName: typebot
      username: typebot
  - name: cache
    title: Cache
    template: redis
    version: "8.10"

versions:
  - name: "3.19"
    release: "3.19.0"
    default: true
    components:
      gateway: {image: "nginx:1.30.5-alpine"}
      builder: {image: "baptistearno/typebot-builder:3.19.0"}
      viewer: {image: "baptistearno/typebot-viewer:3.19.0"}

components:
  # ── Gateway ────────────────────────────────────────────────────────────
  - name: gateway
    title: Gateway
    primary: true
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
        container:
          healthcheck:
            enabled: true
            mode: CMD-SHELL
            # A server of its own on the loopback: healthy while nginx runs.
            command: wget -q -O /dev/null http://127.0.0.1:8081/
            interval: 30s
            timeout: 5s
            startPeriod: 10s
            retries: 3
        resources:
          limits: {memory: 64MB}
      settings:
        kind: {category: webapp, engine: typebot, version: "${{ version.name }}", webapp: {}}
        configFiles:
          default.conf:
            # The viewer's domain to the viewer, every other to the builder.
            content: |
              map $host $typebot {
                "${{ params.viewerDomain }}" ${{ comp.viewer.key }}:3000;
                default ${{ comp.builder.key }}:3000;
              }
              map $http_x_forwarded_proto $forwarded_proto {
                default $http_x_forwarded_proto;
                "" $scheme;
              }
              map $http_upgrade $connection_upgrade {
                default upgrade;
                "" "";
              }

              server {
                listen 80;
                server_name _;
                # Docker's resolver, asked at each request: a component that restarts, or
                # is not up yet, is found again rather than failing nginx's start.
                resolver 127.0.0.11 valid=30s ipv6=off;
                client_max_body_size 50m;

                location / {
                  proxy_pass http://$typebot;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $forwarded_proto;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_read_timeout 300s;
                }
              }

              server {
                listen 127.0.0.1:8081;
                location / { return 204; }
              }
            swarmRef:
              file: {name: /etc/nginx/conf.d/default.conf, mode: 444}
        routing:
          port: 80
          exposePublicly: true
          domains:
            - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}
            - {domain: "${{ params.viewerDomain }}", enabled: true, forceHttps: true}

  # ── Builder ────────────────────────────────────────────────────────────
  - name: builder
    title: Builder
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
        container:
          healthcheck:
            enabled: true
            mode: CMD-SHELL
            # The image's start applies the migrations, and starts the server even when they
            # failed - on a database not answering yet. Unhealthy until the schema is up to
            # date, it is restarted, and migrates again. No curl or wget in the image.
            command: >-
              node -e "fetch('http://127.0.0.1:3000/signin').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))" &&
              ./node_modules/.bin/prisma migrate status --schema=packages/prisma/postgresql/schema.prisma
              --config=packages/prisma/prisma.config.ts >/dev/null 2>&1
            interval: 30s
            timeout: 20s
            startPeriod: 120s
            retries: 3
        resources:
          limits: {memory: 1GB}
      settings:
        kind: {category: webapp, engine: typebot, version: "${{ version.name }}", webapp: {}}
        envVars:
          data: &env
            - k: DATABASE_URL
              v: >-
                postgresql://${{ deps.db.ref.HIVEPAAS_USER }}:${{ deps.db.ref.HIVEPAAS_PASSWORD }}@${{
                deps.db.ref.HIVEPAAS_HOST }}:${{ deps.db.ref.HIVEPAAS_PORT }}/${{
                deps.db.ref.HIVEPAAS_DATABASE_NAME }}
            - k: REDIS_URL
              v: >-
                redis://default:${{ deps.cache.ref.HIVEPAAS_PASSWORD }}@${{
                deps.cache.ref.HIVEPAAS_HOST }}:${{ deps.cache.ref.HIVEPAAS_PORT }}
            - {k: ENCRYPTION_SECRET, v: "${secrets.ENCRYPTION_SECRET}"}
            # The gateway's first domain; the viewer's, the second.
            - {k: NEXTAUTH_URL, v: "${${{ comp.gateway.key }}.HIVEPAAS_APP_URL}"}
            - {k: NEXT_PUBLIC_VIEWER_URL, v: "https://${{ params.viewerDomain }}"}
            # Next.js binds the address HOSTNAME names, which Docker sets to the container
            # id: without this the server does not answer on the loopback.
            - {k: HOSTNAME, v: 0.0.0.0}
            # No update checks from Prisma, in the health check.
            - {k: CHECKPOINT_DISABLE, v: "1"}
            - {k: ADMIN_EMAIL, v: "${{ params.adminEmail }}"}
            - {k: DISABLE_SIGNUP, v: "true"}
            - {k: SMTP_HOST, v: "${{ params.smtpHost }}"}
            - {k: SMTP_PORT, v: "${{ params.smtpPort }}"}
            - {k: SMTP_SECURE, v: "${{ params.smtpSecure }}"}
            - {k: SMTP_USERNAME, v: "${{ params.smtpUser }}"}
            - {k: SMTP_PASSWORD, v: "${secrets.SMTP_PASSWORD}"}
            - {k: NEXT_PUBLIC_SMTP_FROM, v: "${{ params.smtpFrom }}"}
        secrets: &secrets
          ENCRYPTION_SECRET:
            value: "${{ params.encryptionSecret }}"
          SMTP_PASSWORD:
            value: "${{ params.smtpPassword }}"

  # ── Viewer ─────────────────────────────────────────────────────────────
  - name: viewer
    title: Viewer
    needs: [builder]
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
        container:
          healthcheck:
            enabled: true
            mode: CMD-SHELL
            command: >-
              node -e "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"
            interval: 30s
            timeout: 10s
            startPeriod: 60s
            retries: 3
        resources:
          limits: {memory: 768MB}
      settings:
        kind: {category: webapp, engine: typebot, version: "${{ version.name }}", webapp: {}}
        envVars:
          data: *env
        secrets: *secrets
