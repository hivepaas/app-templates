apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: filebrowser-app
  title: File Browser for an app
  tagline: Browse, upload and edit the files of another app in this project
  description: |
    File Browser pointed at another app's files: a site's uploads and themes, a media
    server's library, a document store's folder. Upload, download as archives, rename,
    move and edit them from a web page, without a shell or SFTP.

    **This template sets up**

    - File Browser, serving the files the app you pick keeps on the volume you pick, at
      `/srv`, with write access
    - a small volume of its own for its accounts, shares and settings
    - a memory limit you choose

    **Pick the right volume**

    An app may keep data on more than one volume. Pick the volume the files you want are
    on - for Jellyfin, its media volume rather than its configuration volume.

    **It can change that app's files**

    Everything the other app keeps on that volume can be edited or deleted from here, and
    the other app sees each change at once. Avoid it for databases: changing a running
    database's files corrupts it. Whoever creates this needs write access to the other app.

    **After the first deployment**

    The first start creates the account `admin` with a random password and prints it once,
    in the app's logs: *User 'admin' initialized with randomly generated password*. Sign in
    with it and change it under Settings.
  categories: [webapps/documents, storage/files]
  tags: [files, file-transfer, open-source]
  aliases: [file manager, edit app files, uploads, sftp alternative]
  icon: icons/filebrowser.svg
  links:
    website: https://filebrowser.org
    documentation: https://filebrowser.org/installation.html
    source: https://github.com/filebrowser/filebrowser
  license: Apache-2.0
  requires:
    versionCode: v000001

parameters:
  - name: domain
    title: Domain
    description: >-
      The address this app answers at. Leave it empty to add one later, in the app's
      routing settings.
    type: domain
    optional: true
  - name: targetApp
    title: App
    description: The app whose files to manage.
    type: app
  - name: targetVolume
    title: The app's volume
    description: The volume that app keeps the files on.
    type: volume
  - name: memoryLimit
    title: Memory limit
    type: size
    default: 256MB
    min: 128MB
  - name: dataVolume
    title: Database volume
    description: The volume File Browser's accounts, shares and settings are kept on.
    type: volume

versions:
  - name: "2.63"
    release: "2.63.23"
    default: true
    image: filebrowser/filebrowser:v2.63.23

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    storage:
      mounts:
        # The other app's directory on that volume - all of what it keeps there.
        /srv:
          type: volume
          source: "${{ params.targetVolume }}"
          sourceApp: {app: "${{ params.targetApp }}", write: true}
        /database: {type: volume, source: "${{ params.dataVolume }}"}
    container:
      # The image's entry point is tini, which has to be process 1 to reap what the
      # server leaves behind.
      init: false
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        # The image's own check, against /health.
        command: /healthcheck.sh
        interval: 20s
        timeout: 5s
        startPeriod: 15s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: webapp
      engine: filebrowser
      version: "${{ version.name }}"
      webapp: {}
    routing:
      port: 80
      exposePublicly: true
      domains:
        - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}
