apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: postgres-documentdb
  title: PostgreSQL + DocumentDB
  tagline: PostgreSQL with the DocumentDB extension, the storage FerretDB runs on
  description: |
    PostgreSQL 17 with Microsoft's DocumentDB extension, which stores BSON documents and
    runs MongoDB-style queries inside PostgreSQL. This is the image the FerretDB project
    publishes for FerretDB 2 to run on; create FerretDB from this store to get a MongoDB
    wire-protocol server in front of it.

    **This template sets up**

    - the extension installed in the `postgres` database on the first start
    - a user and a generated password
    - a persistent data volume
    - a health check with `pg_isready`
    - a memory limit you choose

    **The database is always `postgres`**

    DocumentDB schedules its background jobs with pg_cron, which only runs in one database -
    `postgres` here - so that is where the extension lives and what FerretDB connects to.
  categories: [databases/nosql]
  tags: [document, json, sql, open-source]
  aliases: [documentdb, ferretdb backend, mongodb on postgres]
  icon: icons/postgres-documentdb.svg
  links:
    website: https://github.com/microsoft/documentdb
    documentation: https://docs.ferretdb.io/installation/documentdb/docker/
    source: https://github.com/FerretDB/documentdb
  license: MIT
  requires:
    versionCode: v000001

parameters:
  - name: username
    title: Username
    type: string
    default: app
    pattern: '^[a-z_][a-z0-9_]{0,62}$'
  - name: password
    title: Password
    description: Leave empty to generate one.
    type: secret
    minLength: 12
    generate: {length: 32}
  - name: memoryLimit
    title: Memory limit
    type: size
    default: 1GB
    min: 256MB
  - name: dataVolume
    title: Data volume
    description: The volume the database files are kept on.
    type: volume

versions:
  - name: "0.107"
    release: "17-0.107.0"
    default: true
    # The tag leads with the PostgreSQL major, which reads as a moving tag; the digest is
    # what pins it.
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0@sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    storage:
      mounts:
        /var/lib/postgresql/data: {type: volume, source: "${{ params.dataVolume }}"}
    container:
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        command: pg_isready -U "$POSTGRES_USER" -d postgres
        interval: 10s
        timeout: 5s
        startPeriod: 30s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: database
      engine: postgres
      version: "${{ version.name }}"
      database:
        # See the description: pg_cron, and so the extension, only runs here.
        dbName: postgres
        username: "${{ params.username }}"
        password: "${{ params.password }}"
    envVars:
      data:
        - {k: POSTGRES_DB, v: "${HIVEPAAS_DATABASE_NAME}"}
        - {k: POSTGRES_USER, v: "${HIVEPAAS_USER}"}
        - {k: POSTGRES_PASSWORD, v: "${HIVEPAAS_PASSWORD}"}
    routing:
      port: 5432
