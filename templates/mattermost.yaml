apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: mattermost
  title: Mattermost
  tagline: Team chat in channels, with threads, search and the apps people expect
  description: |
    Mattermost is messaging for a team: channels, threads, file sharing, search, and desktop
    and phone apps that behave like the ones people already use. Integrations arrive as
    incoming webhooks, slash commands and bots.

    **x86-64 only**

    Mattermost publishes this image for `linux/amd64` and no other architecture. On an ARM
    machine - an Ampere or Graviton server, an Apple Silicon laptop - it will not start.

    **This template creates two apps**

    - **Mattermost**, on a volume for uploads, configuration, logs and plugins
    - **a PostgreSQL database** for it, named after the app with `-db` added

    **After the first deployment**

    Open the app and create the first account. It becomes the system administrator, and
    whoever gets there first takes it, so do not leave the page for somebody else.

    **Set the site URL**

    Mattermost builds the links in notifications and the addresses its apps connect back to
    from the address it is configured with, and it will not accept an empty one for those.
    Once the app has a domain, add `MM_SERVICESETTINGS_SITEURL` as an environment variable
    with the full URL - `https://chat.example.com`.

    **Email**

    Invitations, password resets and notification mail need an SMTP server, which this
    template does not set up. Configure one under **System Console → Environment → SMTP**,
    or point it at a Mailpit app next to it while testing.
  categories: [webapps/communication]
  tags: [team-chat, chat, collaboration, open-source]
  aliases: [chat, slack, teams, messaging]
  icon: icons/mattermost.svg
  links:
    website: https://mattermost.com
    documentation: https://docs.mattermost.com
    source: https://github.com/mattermost/mattermost
  license: Apache-2.0
  requires:
    versionCode: v000001

parameters:
  - name: domain
    title: Domain
    description: >-
      The address this app answers at. Leave it empty to add one later, in the app's
      routing settings.
    type: domain
    optional: true
  - name: memoryLimit
    title: Memory limit
    type: size
    default: 2GB
    min: 1GB
  - name: dataVolume
    title: Data volume
    description: The volume uploads, configuration, logs and plugins are kept on.
    type: volume

dependencies:
  - name: db
    title: Database
    template: postgres
    version: "17"
    params:
      dbName: mattermost
      username: mattermost

versions:
  - name: "11.11"
    release: "11.11.0"
    default: true
    image: mattermost/mattermost-team-edition:11.11.0

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    storage:
      # One volume, a directory of it each. Mattermost writes to all of these and loses
      # something real from every one of them: the uploads people shared, the settings made
      # in the System Console, the plugins installed into a running server.
      mounts:
        /mattermost/config:
          {type: volume, source: "${{ params.dataVolume }}", volumeOptions: {subpath: config}}
        /mattermost/data:
          {type: volume, source: "${{ params.dataVolume }}", volumeOptions: {subpath: data}}
        /mattermost/logs:
          {type: volume, source: "${{ params.dataVolume }}", volumeOptions: {subpath: logs}}
        /mattermost/plugins:
          {type: volume, source: "${{ params.dataVolume }}", volumeOptions: {subpath: plugins}}
        /mattermost/client/plugins:
          {type: volume, source: "${{ params.dataVolume }}", volumeOptions: {subpath: client-plugins}}
    container:
      healthcheck:
        enabled: true
        # The image holds the Mattermost binaries and nothing else - no shell, no curl - so
        # the check is an argv, and it is the one the image ships with: mmctl over the local
        # socket, which is what local mode below is enabled for.
        mode: CMD
        command: /mattermost/bin/mmctl system status --local
        interval: 20s
        timeout: 10s
        startPeriod: 120s
        retries: 6
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: webapp
      engine: mattermost
      version: "${{ version.name }}"
      webapp: {}
    envVars:
      data:
        - {k: MM_SQLSETTINGS_DRIVERNAME, v: postgres}
        # One connection string. Generated passwords are letters and digits only, so
        # nothing here needs escaping, and the connection stays inside the project network.
        - k: MM_SQLSETTINGS_DATASOURCE
          v: >-
            postgres://${{ deps.db.ref.HIVEPAAS_USER }}:${{ deps.db.ref.HIVEPAAS_PASSWORD }}@${{
            deps.db.ref.HIVEPAAS_HOST }}:${{ deps.db.ref.HIVEPAAS_PORT }}/${{
            deps.db.ref.HIVEPAAS_DATABASE_NAME }}?sslmode=disable&connect_timeout=10
        # Local mode opens a unix socket for mmctl, which is how the health check above
        # asks the server whether it is up. It is reachable only from inside the container.
        - {k: MM_SERVICESETTINGS_ENABLELOCALMODE, v: "true"}
        # TLS is terminated in front of the app, so Mattermost serves plain HTTP.
        - {k: MM_SERVICESETTINGS_LISTENADDRESS, v: ":8065"}
    routing:
      port: 8065
      exposePublicly: true
      domains:
        - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}
