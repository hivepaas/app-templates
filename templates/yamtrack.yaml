apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: yamtrack
  title: Yamtrack
  tagline: A media tracker for movies, shows, games, books and comics
  description: |
    Yamtrack is a self-hosted media tracker for everything you watch, read or play:
    movies, television, anime, manga, video games, books and comics. It features
    a unified dashboard, sync integrations with external services like Trakt,
    Simkl, AniList, Plex and Jellyfin, and multi-user support.

    **This template sets up**

    - **Yamtrack**, with an SQLite database on a persistent volume
    - **a Redis cache** for background tasks and session state

    **Signing in**

    There is no default account and no administrator to create: open the app and register
    one at `/signup/` - the sign-in page links to it. Every account is an ordinary user who
    tracks their own media; the first one has no special rights.

    **Close registration once your accounts exist**

    While registration is on, which it is by default, anyone who can reach the address can
    make an account. Once everyone who should have one does, add the env var
    `REGISTRATION` with the value `False` in the app's env vars, and redeploy.

    **The admin interface is off**

    Django's admin - raw access to every table - is disabled, and day-to-day use never
    needs it. To open it at `/admin/`, set `ADMIN_ENABLED` to `True`, then give an account
    staff rights from a shell in the app's container:
    `python manage.py shell -c "from django.contrib.auth import get_user_model; get_user_model().objects.filter(username='you').update(is_staff=True, is_superuser=True)"`
  categories: [webapps/media]
  tags: [tasks, open-source]
  aliases: [media-tracker, entertainment, trakt, tracker]
  icon: icons/yamtrack.png
  links:
    website: https://fuzzygrim.github.io/Yamtrack
    documentation: https://fuzzygrim.github.io/Yamtrack
    source: https://github.com/FuzzyGrim/Yamtrack
  license: AGPL-3.0-only
  requires:
    versionCode: v000001

parameters:
  - name: domain
    title: Domain
    description: >-
      The address this app answers at. Leave it empty to add one later, in the app's
      routing settings.
    type: domain
    optional: true
  - name: secret
    title: Secret key
    description: What signs the session tokens. Leave empty to generate one.
    type: secret
    generate: {length: 64, charset: hex}
  - name: memoryLimit
    title: Memory limit
    type: size
    default: 512MB
    min: 256MB
  - name: dataVolume
    title: Data volume
    description: The volume the SQLite database is kept on.
    type: volume

dependencies:
  - name: cache
    title: Redis
    template: redis
    version: "8.10"

versions:
  - name: "0.26"
    release: "0.26.3"
    default: true
    image: ghcr.io/fuzzygrim/yamtrack:0.26.3

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    storage:
      mounts:
        /yamtrack/db: {type: volume, source: "${{ params.dataVolume }}"}
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: webapp
      engine: yamtrack
      version: "${{ version.name }}"
      webapp: {}
    envVars:
      data:
        - {k: TZ, v: UTC}
        - {k: SECRET, v: "${secrets.SECRET}"}
        - k: REDIS_URL
          v: >-
            redis://default:${{ deps.cache.ref.HIVEPAAS_PASSWORD }}@${{
            deps.cache.ref.HIVEPAAS_HOST }}:${{ deps.cache.ref.HIVEPAAS_PORT }}
    secrets:
      SECRET:
        value: "${{ params.secret }}"
    routing:
      port: 8000
      exposePublicly: true
      domains:
        - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}
