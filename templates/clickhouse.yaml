apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: clickhouse
  title: ClickHouse
  tagline: A column-oriented database for real-time analytics
  description: |
    ClickHouse is a column-oriented SQL database built to run analytical queries over large
    volumes of data in real time.

    **This template sets up**

    - a database and a user with a generated password
    - a persistent data volume
    - a health check on the HTTP `/ping` endpoint
    - a memory limit you choose

    Other apps in the same environment reach it with `HIVEPAAS_HOST`, `HIVEPAAS_PORT` (8123,
    the HTTP interface most client libraries use), `HIVEPAAS_USER`, `HIVEPAAS_PASSWORD` and
    `HIVEPAAS_DATABASE_NAME`. The native protocol listens on port 9000.

    26.8 and 26.3 are long-term support releases.
  categories: [databases/analytics, databases/sql]
  tags: [sql, analytics, olap, open-source]
  aliases: [ch, clickhouse-server]
  icon: icons/clickhouse.svg
  links:
    website: https://clickhouse.com
    documentation: https://clickhouse.com/docs
    source: https://github.com/ClickHouse/ClickHouse
  license: Apache-2.0
  requires:
    versionCode: v000001

parameters:
  - name: dbName
    title: Database name
    type: string
    default: app
    pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'
  - name: username
    title: Username
    type: string
    default: app
    pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'
  - name: password
    title: Password
    description: Leave empty to generate one.
    type: secret
    minLength: 12
    generate: {length: 32}
  - name: memoryLimit
    title: Memory limit
    description: ClickHouse sizes its caches from this, and complains below 2GB.
    type: size
    default: 2GB
    min: 1GB
  - name: dataVolume
    title: Data volume
    description: The volume the database files are kept on.
    type: volume

versions:
  - name: "26.8"
    release: "26.8.2.7"
    default: true
    image: clickhouse:26.8.2.7-jammy
  - name: "26.3"
    release: "26.3.33.24"
    image: clickhouse:26.3.33.24-jammy

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    storage:
      mounts:
        /var/lib/clickhouse: {type: volume, source: "${{ params.dataVolume }}"}
    container:
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        command: wget -q --spider http://127.0.0.1:8123/ping
        interval: 10s
        timeout: 5s
        startPeriod: 30s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: database
      engine: clickhouse
      version: "${{ version.name }}"
      database:
        dbName: "${{ params.dbName }}"
        username: "${{ params.username }}"
        password: "${{ params.password }}"
    envVars:
      data:
        - {k: CLICKHOUSE_DB, v: "${HIVEPAAS_DATABASE_NAME}"}
        - {k: CLICKHOUSE_USER, v: "${HIVEPAAS_USER}"}
        - {k: CLICKHOUSE_PASSWORD, v: "${HIVEPAAS_PASSWORD}"}
        - {k: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, v: "1"}
    routing:
      port: 8123
