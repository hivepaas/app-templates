apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: langfuse-worker
  title: Langfuse Worker
  tagline: The process that turns queued Langfuse events into readable traces
  description: |
    The worker half of Langfuse. The interface accepts events and queues them; this takes
    them off the queue, reads them from S3 and writes them into ClickHouse, which is what
    makes them appear as traces. It also runs the evaluations and the scheduled jobs. It
    serves nothing and takes no domain.

    **Deploy Langfuse first**

    This attaches to a **Langfuse** that already exists, and to the three apps created
    beside it. Without this worker, Langfuse accepts traces and shows none of them.

    **What to fill in**

    - **Database app**, **ClickHouse app** and **Redis app** - the `-db`, `-analytics` and
      `-cache` apps created beside your Langfuse. Their addresses and passwords are read
      from them.
    - **The S3 settings and the encryption key** - the same values you gave Langfuse. The
      encryption key must match exactly, or the worker cannot read what the interface
      stored; both are on that app's environment variables.

    **Adding capacity**

    One worker is enough for most installations. For a heavy one, raise this app's replica
    count - they share the queue.
  categories: [webapps/ai, observability/monitoring]
  tags: [ai, llm, monitoring, open-source]
  aliases: [langfuse worker, tracing, ingestion, background jobs, evals]
  icon: icons/langfuse.svg
  links:
    website: https://langfuse.com
    documentation: https://langfuse.com/self-hosting/deployment/docker-compose
    source: https://github.com/langfuse/langfuse
  license: MIT
  requires:
    versionCode: v000001

parameters:
  - name: dbApp
    title: Database app
    description: >-
      The PostgreSQL app your Langfuse uses - the one named after it with `-db` added.
    type: app
  - name: analyticsApp
    title: ClickHouse app
    description: >-
      The ClickHouse app your Langfuse uses - the one named after it with `-analytics`
      added.
    type: app
  - name: redisApp
    title: Redis app
    description: >-
      The Redis app your Langfuse queues into - the one named after it with `-cache` added.
    type: app
  - name: s3Endpoint
    title: S3 address
    description: The same address you gave Langfuse - http://garage:3900, for instance.
    type: string
    default: http://garage:3900
    pattern: '^https?://[^\s/?#]+$'
  - name: s3Bucket
    title: S3 bucket
    description: The same bucket you gave Langfuse.
    type: string
    default: langfuse
    pattern: '^[a-z0-9][a-z0-9.-]{2,62}$'
  - name: s3AccessKey
    title: S3 access key
    type: string
    default: langfuse
    maxLength: 128
  - name: s3SecretKey
    title: S3 secret key
    type: secret
    minLength: 8
  - name: s3Region
    title: S3 region
    type: string
    default: auto
    pattern: '^[A-Za-z0-9-]{1,32}$'
  - name: encryptionKey
    title: Encryption key
    description: >-
      The same value as `ENCRYPTION_KEY` on the Langfuse app - 64 hexadecimal characters.
      Copy it exactly.
    type: secret
    minLength: 16
    maxLength: 64
  - name: salt
    title: Password salt
    description: The same value as `SALT` on the Langfuse app.
    type: secret
    minLength: 16
  - name: memoryLimit
    title: Memory limit
    description: >-
      Ingestion is what uses it; a burst of traces is what makes it matter.
    type: size
    default: 2GB
    min: 1GB

versions:
  - name: "4.41"
    release: "4.41.0"
    default: true
    image: langfuse/langfuse-worker:4.41.0

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    container:
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        # The worker's own endpoint, on its own port.
        command: >-
          node -e "fetch('http://127.0.0.1:3030/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        interval: 30s
        timeout: 10s
        startPeriod: 120s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: webapp
      engine: langfuse
      version: "${{ version.name }}"
      webapp: {}
    envVars:
      data:
        # Overrides the container's own hostname, which the worker otherwise binds its
        # HTTP server to - and Docker sets it to the app's key, so without this the
        # health check and every other loopback request are refused.
        - {k: HOSTNAME, v: "0.0.0.0"}
        - {k: SALT, v: "${secrets.SALT}"}
        - {k: ENCRYPTION_KEY, v: "${secrets.ENCRYPTION_KEY}"}
        # Read from the three apps chosen above, rather than typed in again here.
        - k: DATABASE_URL
          v: >-
            postgresql://${${{ params.dbApp }}.HIVEPAAS_USER}:${${{ params.dbApp
            }}.HIVEPAAS_PASSWORD}@${${{ params.dbApp }}.HIVEPAAS_HOST}:${${{ params.dbApp
            }}.HIVEPAAS_PORT}/${${{ params.dbApp }}.HIVEPAAS_DATABASE_NAME}
        - {k: CLICKHOUSE_URL, v: "http://${${{ params.analyticsApp }}.HIVEPAAS_HOST}:8123"}
        - {k: CLICKHOUSE_MIGRATION_URL, v: "clickhouse://${${{ params.analyticsApp }}.HIVEPAAS_HOST}:9000"}
        - {k: CLICKHOUSE_USER, v: "${${{ params.analyticsApp }}.HIVEPAAS_USER}"}
        - {k: CLICKHOUSE_PASSWORD, v: "${${{ params.analyticsApp }}.HIVEPAAS_PASSWORD}"}
        - {k: CLICKHOUSE_CLUSTER_ENABLED, v: "false"}
        - {k: REDIS_HOST, v: "${${{ params.redisApp }}.HIVEPAAS_HOST}"}
        - {k: REDIS_PORT, v: "${${{ params.redisApp }}.HIVEPAAS_PORT}"}
        - {k: REDIS_AUTH, v: "${${{ params.redisApp }}.HIVEPAAS_PASSWORD}"}
        - {k: LANGFUSE_S3_EVENT_UPLOAD_BUCKET, v: "${{ params.s3Bucket }}"}
        - {k: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT, v: "${{ params.s3Endpoint }}"}
        - {k: LANGFUSE_S3_EVENT_UPLOAD_REGION, v: "${{ params.s3Region }}"}
        - {k: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID, v: "${{ params.s3AccessKey }}"}
        - {k: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY, v: "${secrets.S3_SECRET_KEY}"}
        - {k: LANGFUSE_S3_EVENT_UPLOAD_PREFIX, v: "events/"}
        - {k: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE, v: "true"}
        - {k: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET, v: "${{ params.s3Bucket }}"}
        - {k: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT, v: "${{ params.s3Endpoint }}"}
        - {k: LANGFUSE_S3_MEDIA_UPLOAD_REGION, v: "${{ params.s3Region }}"}
        - {k: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID, v: "${{ params.s3AccessKey }}"}
        - {k: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY, v: "${secrets.S3_SECRET_KEY}"}
        - {k: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX, v: "media/"}
        - {k: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE, v: "true"}
        - {k: TELEMETRY_ENABLED, v: "false"}
    secrets:
      SALT:
        value: "${{ params.salt }}"
      ENCRYPTION_KEY:
        value: "${{ params.encryptionKey }}"
      S3_SECRET_KEY:
        value: "${{ params.s3SecretKey }}"
