apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: freshrss
  title: FreshRSS
  tagline: A feed reader with filters, folders and an app for every phone
  description: |
    FreshRSS reads RSS, Atom and JSON feeds, sorts them into folders, applies filters as
    articles arrive, and keeps what you have read in sync between every device. It speaks the
    Fever and Google Reader APIs, so the mobile reader you already like can use it as its
    back end, and it can scrape a page into a feed when a site offers none.

    **This template sets up**

    - FreshRSS on a volume, holding the articles, your account and any extensions
    - your account, made at the first start from the username and password here
    - the API turned on, for mobile apps and anything else that syncs
    - feeds refreshed twice an hour by its own scheduler

    **Your account is made at the first start**

    FreshRSS is installed before it first answers, with the account below as administrator -
    there is no setup wizard for a stranger to reach. The password is under this app's
    Secrets, as `FRESHRSS_PASSWORD`, and it is also the API password a mobile app asks for.

    **Using it from a phone**

    Reeder, NetNewsWire, FeedMe and most others take a Google Reader account: the address of
    this app, the username, and the API password. The endpoint is `/api/greader.php`, which
    those apps append themselves.

    **What the volume holds**

    The SQLite database with feeds, articles and read state, plus any extension you install.
    Nothing is kept anywhere else.
  categories: [webapps/knowledge]
  tags: [documents, open-source]
  aliases: [rss, feeds, reader, atom, news]
  icon: icons/freshrss.svg
  links:
    website: https://freshrss.org
    documentation: https://freshrss.github.io/FreshRSS/
    source: https://github.com/FreshRSS/FreshRSS
  license: AGPL-3.0-only
  requires:
    versionCode: v000001

parameters:
  - name: domain
    title: Domain
    description: >-
      The address this app answers at. Leave it empty to add one later, in the app's
      routing settings.
    type: domain
    optional: true
  - name: adminUsername
    title: Username
    type: string
    default: admin
    pattern: '^[a-zA-Z0-9_]{2,38}$'
  - name: adminPassword
    title: Password
    description: >-
      At least 7 characters, and also the password a mobile app uses for the API. Leave
      empty to generate one.
    type: secret
    minLength: 7
    generate: {length: 24}
  - name: timezone
    title: Time zone
    description: An IANA name, such as Europe/Amsterdam.
    type: string
    default: UTC
    pattern: '^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+)*$'
  - name: memoryLimit
    title: Memory limit
    type: size
    default: 512MB
    min: 128MB
  - name: dataVolume
    title: Data volume
    description: The volume articles, your account and extensions are kept on.
    type: volume

versions:
  - name: "1.30"
    release: "1.30.0"
    default: true
    image: freshrss/freshrss:1.30.0-alpine

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    storage:
      mounts:
        /var/www/FreshRSS/data:
          type: volume
          source: "${{ params.dataVolume }}"
          volumeOptions: {subpath: data}
        /var/www/FreshRSS/extensions:
          type: volume
          source: "${{ params.dataVolume }}"
          volumeOptions: {subpath: extensions}
    container:
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        # The application itself rather than the root, which only redirects to it. No curl
        # in the image, but wget is there.
        command: wget -q -O /dev/null http://127.0.0.1:80/i/
        interval: 20s
        timeout: 10s
        startPeriod: 60s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: webapp
      engine: freshrss
      version: "${{ version.name }}"
      webapp: {}
    envVars:
      data:
        - {k: TZ, v: "${{ params.timezone }}"}
        # Its own scheduler refreshes feeds, at thirteen and forty-three minutes past.
        - {k: CRON_MIN, v: "13,43"}
        # Both are read once, while the installation is empty, and ignored afterwards: the
        # first creates the installation, the second the account that administers it.
        - {k: FRESHRSS_INSTALL, v: "--api-enabled --default-user ${{ params.adminUsername }} --language en"}
        - k: FRESHRSS_USER
          v: >-
            --user ${{ params.adminUsername }} --password ${secrets.FRESHRSS_PASSWORD}
            --api-password ${secrets.FRESHRSS_PASSWORD} --language en
    secrets:
      FRESHRSS_PASSWORD:
        value: "${{ params.adminPassword }}"
    routing:
      port: 80
      exposePublicly: true
      domains:
        - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}
