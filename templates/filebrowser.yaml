apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: filebrowser
  title: File Browser
  tagline: Browse, upload, share and edit the files on a volume, from a web page
  description: |
    File Browser puts a volume in a web page: folders and files you can upload to, download
    as archives, rename, move, preview and edit, and links you can share with people who
    have no account. Each account can be kept to its own folder.

    **This template sets up**

    - File Browser, serving the files volume you pick
    - a small separate volume for its database of users, shares and settings
    - a memory limit you choose

    **After the first deployment**

    The first start creates the account `admin` with a random password and prints it once,
    in the app's logs: *User 'admin' initialized with randomly generated password*. Sign in
    with it and change it under Settings.

    **Its files are its own**

    HivePaaS gives every app its own folder on a volume, so picking a volume another app
    uses does not show that app's files here - File Browser sees only what is uploaded to
    it. It is a place to keep and share files, not a window into other apps.
  categories: [webapps/documents, storage/files]
  tags: [files, file-transfer, open-source]
  aliases: [file manager, web file manager, upload, share files]
  icon: icons/filebrowser.svg
  links:
    website: https://filebrowser.org
    documentation: https://filebrowser.org/installation.html
    source: https://github.com/filebrowser/filebrowser
  license: Apache-2.0
  requires:
    versionCode: v000001

parameters:
  - name: domain
    title: Domain
    description: >-
      The address this app answers at. Leave it empty to add one later, in the app's
      routing settings.
    type: domain
    optional: true
  - name: memoryLimit
    title: Memory limit
    type: size
    default: 256MB
    min: 128MB
  - name: filesVolume
    title: Files volume
    description: The volume whose files are browsed and shared.
    type: volume
  - name: dataVolume
    title: Database volume
    description: The volume the accounts, shares and settings are kept on.
    type: volume

versions:
  - name: "2.63"
    release: "2.63.23"
    default: true
    image: filebrowser/filebrowser:v2.63.23

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    storage:
      mounts:
        /srv: {type: volume, source: "${{ params.filesVolume }}"}
        /database: {type: volume, source: "${{ params.dataVolume }}"}
    container:
      # The image's entry point is tini, which has to be process 1 to reap what the
      # server leaves behind.
      init: false
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        # The image's own check, against /health.
        command: /healthcheck.sh
        interval: 20s
        timeout: 5s
        startPeriod: 15s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: webapp
      engine: filebrowser
      version: "${{ version.name }}"
      webapp: {}
    routing:
      port: 80
      exposePublicly: true
      domains:
        - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}
