apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: bookstack
  title: BookStack
  tagline: A wiki organised like a library - shelves, books, chapters and pages
  description: |
    BookStack keeps documentation in a shape people understand without training: shelves
    hold books, books hold chapters, chapters hold pages. Pages are written in a WYSIWYG or a
    Markdown editor, with revisions, search, diagrams, and permissions down to a single
    page.

    **This template creates two apps**

    - **BookStack**, on a volume for uploads, images and its settings
    - **a MariaDB database** for it, named after the app with `-db` added

    **After the first deployment**

    Sign in as `admin@admin.com` with the password `password`, and change both straight
    away - it is the account the first start creates, and it is the same on every BookStack
    in the world.

    **The public address has to be right**

    BookStack builds every link and every image address from it, so a wrong one shows as
    broken images and redirects to somewhere else. Set it to the HTTPS address of the domain
    you give the app. Changing it later is possible, but links already written into pages
    keep the old address until you run the app's `bookstack:update-url` command.

    **Backups are both apps**

    Pages and their history are in the database; uploaded files and images are on this
    app's volume. Back up both.
  categories: [webapps/knowledge]
  tags: [wiki, documents, collaboration, open-source]
  aliases: [wiki, documentation, knowledge base, confluence]
  icon: icons/bookstack.svg
  links:
    website: https://www.bookstackapp.com
    documentation: https://www.bookstackapp.com/docs/
    source: https://github.com/BookStackApp/BookStack
  license: MIT
  requires:
    versionCode: v000001

parameters:
  - name: appUrl
    title: Public address
    description: >-
      The address you reach it at, scheme and all - https://docs.example.com. Every link and
      image address is built from it, so the default only works for other apps in this
      project.
    type: string
    default: http://${HIVEPAAS_HOST}
    # A scheme and a host, and nothing after them.
    pattern: '^https?://[^\s/?#]+$'
  - name: domain
    title: Domain
    description: >-
      The domain HivePaaS routes to this app. Normally the host part of the address above.
      Leave it empty to add one later, in the app's routing settings.
    type: domain
    optional: true
  - name: appKey
    title: Application key
    description: >-
      Encrypts sessions and stored secrets - exactly 32 characters, and changing it later
      signs everyone out and makes what it encrypted unreadable. Leave empty to generate one.
    type: secret
    minLength: 32
    maxLength: 32
    generate: {length: 32}
  - name: memoryLimit
    title: Memory limit
    type: size
    default: 512MB
    min: 256MB
  - name: dataVolume
    title: Data volume
    description: The volume uploaded files, images, themes and settings are kept on.
    type: volume

dependencies:
  - name: db
    title: Database
    template: mariadb
    version: "11.8"
    params:
      dbName: bookstack
      username: bookstack

versions:
  - name: "26.05"
    release: "26.05.5"
    default: true
    image: lscr.io/linuxserver/bookstack:v26.05.5-ls284

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    storage:
      mounts:
        /config: {type: volume, source: "${{ params.dataVolume }}"}
    container:
      # The image is built on s6-overlay, whose init has to be process 1 itself:
      # behind the one an app is created with it exits saying "can only run as
      # pid 1", over and over, and the app never starts.
      init: false
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        # /status checks the database, the cache and the session store, and answers
        # 500 when any of them fails.
        command: curl -fsS -o /dev/null http://127.0.0.1/status
        interval: 20s
        timeout: 10s
        # The first start runs the migrations that create the database.
        startPeriod: 120s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: webapp
      engine: bookstack
      version: "${{ version.name }}"
      webapp: {}
    envVars:
      data:
        - {k: APP_URL, v: "${{ params.appUrl }}"}
        - {k: APP_KEY, v: "${secrets.APP_KEY}"}
        # TLS is terminated in front of the app, so it has to believe the scheme the proxy
        # forwards rather than the one it sees.
        - {k: APP_PROXIES, v: "*"}
        - {k: DB_HOST, v: "${{ deps.db.ref.HIVEPAAS_HOST }}"}
        - {k: DB_PORT, v: "${{ deps.db.ref.HIVEPAAS_PORT }}"}
        - {k: DB_DATABASE, v: "${{ deps.db.ref.HIVEPAAS_DATABASE_NAME }}"}
        - {k: DB_USERNAME, v: "${{ deps.db.ref.HIVEPAAS_USER }}"}
        - {k: DB_PASSWORD, v: "${{ deps.db.ref.HIVEPAAS_PASSWORD }}"}
        - {k: PUID, v: "1000"}
        - {k: PGID, v: "1000"}
    secrets:
      APP_KEY:
        value: "${{ params.appKey }}"
    routing:
      port: 80
      exposePublicly: true
      domains:
        - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}
