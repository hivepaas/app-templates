apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: qbittorrent
  title: qBittorrent
  tagline: A BitTorrent client with a web interface, for downloading on the server
  description: |
    qBittorrent downloads torrents on the server and is driven from its web interface:
    categories, speed limits and schedules, RSS rules, and search. Sonarr and Radarr, also
    in this store, send it what to download and pick up what it finishes.

    **This template sets up**

    - qBittorrent, on one volume for its settings and another for the downloads
    - the torrent port published on the node over TCP and UDP
    - the web interface through the reverse proxy
    - a memory limit you choose

    **After the first deployment**

    Sign in as `admin` with the temporary password qBittorrent prints in the app's logs -
    *A temporary password is provided for this session*. It changes at every start until
    you set your own under Tools, Options, Web UI.

    **The downloads are shared**

    Sonarr and Radarr are given this app's downloads, at `/downloads` - the same path as
    here - so the files qBittorrent reports are where they can find them. Keep the default
    save path under `/downloads`.
  categories: [webapps/media]
  tags: [file-transfer, open-source]
  aliases: [torrent, bittorrent, downloader, transmission alternative]
  icon: icons/qbittorrent.svg
  links:
    website: https://www.qbittorrent.org
    documentation: https://github.com/qbittorrent/qBittorrent/wiki
    source: https://github.com/qbittorrent/qBittorrent
  license: GPL-2.0-or-later
  requires:
    versionCode: v000001

parameters:
  - name: domain
    title: Domain
    description: >-
      The address the web interface answers at. Leave it empty to add one later, in the
      app's routing settings.
    type: domain
    optional: true
  - name: torrentPort
    title: Torrent port
    description: The port on the node other peers connect to, over TCP and UDP.
    type: int
    default: 6881
    min: 1
    max: 65535
  - name: timezone
    title: Time zone
    description: An IANA name, such as Europe/Amsterdam.
    type: string
    default: UTC
    pattern: '^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+)*$'
  - name: memoryLimit
    title: Memory limit
    type: size
    default: 1GB
    min: 256MB
  - name: dataVolume
    title: Settings volume
    description: The volume qBittorrent's settings and torrent state are kept on.
    type: volume
  - name: downloadsVolume
    title: Downloads volume
    description: The volume the downloads are written to, mounted at /downloads.
    type: volume

versions:
  - name: "5.2"
    release: "5.2.3"
    default: true
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls477

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    storage:
      mounts:
        /config: {type: volume, source: "${{ params.dataVolume }}"}
        /downloads: {type: volume, source: "${{ params.downloadsVolume }}"}
    networks:
      endpointSpec:
        ports:
          # The container listens on the same port it is published on: qBittorrent
          # announces its own port to trackers and peers, so the two have to agree.
          - {target: "${{ params.torrentPort }}", published: "${{ params.torrentPort }}", protocol: tcp, publishMode: host}
          - {target: "${{ params.torrentPort }}", published: "${{ params.torrentPort }}", protocol: udp, publishMode: host}
    container:
      # The image is built on s6-overlay, whose init has to be process 1 itself:
      # behind the one an app is created with it exits saying "can only run as
      # pid 1", over and over, and the app never starts.
      init: false
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        command: curl -fsS -o /dev/null http://127.0.0.1:8080/
        interval: 20s
        timeout: 5s
        startPeriod: 30s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: webapp
      engine: qbittorrent
      version: "${{ version.name }}"
      webapp: {}
    envVars:
      data:
        - {k: PUID, v: "1000"}
        - {k: PGID, v: "1000"}
        - {k: TZ, v: "${{ params.timezone }}"}
        - {k: WEBUI_PORT, v: "8080"}
        - {k: TORRENTING_PORT, v: "${{ params.torrentPort }}"}
    routing:
      port: 8080
      exposePublicly: true
      domains:
        - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}
