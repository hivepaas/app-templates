apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: shlink-postgres
  title: Shlink with PostgreSQL
  tagline: The short-link server, with its links and visits in a database
  description: |
    This is [Shlink](shlink), with one difference: the short links and the visits they
    record are kept in a PostgreSQL database created alongside it rather than in a SQLite
    file. Visits are what grow - every click is a row - so this is the version that keeps
    growing comfortably.

    **When this is the one to use**

    Links that get real traffic, or a backup routine that covers the databases here and not
    the volumes. For a handful of links the plain [Shlink](shlink) template is simpler.

    **This template creates two apps**

    - **Shlink** itself
    - **a PostgreSQL database**, named with `-db`, holding the links and the visits

    **The API key**

    The key generated for you is under this app's Secrets, as `INITIAL_API_KEY`. It is what
    the web client and the command line use; Shlink has no interface of its own.
  categories: [webapps/dev-tools]
  tags: [open-source]
  aliases: [url-shortener, short-links, bitly, redirects, shlink postgres]
  icon: icons/shlink.svg
  links:
    website: https://shlink.io
    documentation: https://shlink.io/documentation/
    source: https://github.com/shlinkio/shlink
  license: MIT
  requires:
    versionCode: v000001

parameters:
  - name: shortDomain
    title: Short link domain
    description: >-
      The host every short URL is built from - the domain you route to this app. The default
      only works for other apps in this project.
    type: string
    default: ${HIVEPAAS_HOST}
    pattern: '^[^\s/:]+$'
  - name: domain
    title: Domain
    description: >-
      The domain HivePaaS routes to this app. Normally the same as the short link domain
      above. Leave it empty to add one later, in the app's routing settings.
    type: domain
    optional: true
  - name: apiKey
    title: API key
    description: >-
      Created at the first start and used for every request. Leave empty to generate one.
    type: secret
    minLength: 16
    generate: {length: 32}
  - name: memoryLimit
    title: Memory limit
    type: size
    default: 512MB
    min: 256MB
  - name: dataVolume
    title: Data volume
    description: The volume the links and their visit statistics are kept on.
    type: volume

dependencies:
  - name: db
    title: Database
    template: postgres
    version: "17"
    params:
      dbName: shlink
      username: shlink

versions:
  - name: "5.1"
    release: "5.1.6"
    default: true
    image: shlinkio/shlink:5.1.6

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    storage:
      mounts:
        # noCopy: the image ships this directory, and docker would copy it - ownership and
        # all - into the empty volume the first time it is mounted here.
        /etc/shlink/data:
          type: volume
          source: "${{ params.dataVolume }}"
          volumeOptions: {noCopy: true}
    container:
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        # /rest/health answers without a key, and answers for the database behind it.
        command: curl -fsS -o /dev/null http://127.0.0.1:8080/rest/health
        interval: 20s
        timeout: 10s
        startPeriod: 60s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: webapp
      engine: shlink
      version: "${{ version.name }}"
      webapp: {}
    envVars:
      data:
        - {k: DEFAULT_DOMAIN, v: "${{ params.shortDomain }}"}
        # TLS is terminated in front of the app, and the links it writes have to say https
        # rather than the scheme its own server sees.
        - {k: IS_HTTPS_ENABLED, v: "true"}
        - {k: INITIAL_API_KEY, v: "${secrets.INITIAL_API_KEY}"}
        - {k: TIMEZONE, v: UTC}
        # The database this template creates. Shlink migrates it on first start.
        - {k: DB_DRIVER, v: postgres}
        - {k: DB_HOST, v: "${{ deps.db.ref.HIVEPAAS_HOST }}"}
        - {k: DB_PORT, v: "${{ deps.db.ref.HIVEPAAS_PORT }}"}
        - {k: DB_NAME, v: "${{ deps.db.ref.HIVEPAAS_DATABASE_NAME }}"}
        - {k: DB_USER, v: "${{ deps.db.ref.HIVEPAAS_USER }}"}
        - {k: DB_PASSWORD, v: "${{ deps.db.ref.HIVEPAAS_PASSWORD }}"}
    secrets:
      INITIAL_API_KEY:
        value: "${{ params.apiKey }}"
    routing:
      port: 8080
      exposePublicly: true
      domains:
        - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}
