apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: alexandrie
  title: Alexandrie
  tagline: An open-source knowledge base and collaborative Markdown workspace
  description: |
    Alexandrie is a self-hosted knowledge base and Markdown note-taking workspace
    designed as an alternative to Notion, Confluence, and Obsidian. It features
    a keyboard-first editor with LaTeX and diagram support, nested workspaces,
    and granular team permissions.

    **This template creates three apps**

    - **Alexandrie Frontend**, running the Nuxt web application on port 8200
    - **Alexandrie Backend**, running the Go API server on port 8201
    - **a MariaDB database** for persistent records and workspace data, named with `-db`
  categories: [webapps/knowledge]
  tags: [collaboration, notes, documents, open-source]
  aliases: [wiki, knowledge base, notion alternative, obsidian alternative, notes, alexandrie]
  icon: icons/alexandrie.svg
  links:
    website: https://github.com/Smaug6739/Alexandrie
    documentation: https://github.com/Smaug6739/Alexandrie
    source: https://github.com/Smaug6739/Alexandrie
  license: AGPL-3.0-or-later
  requires:
    versionCode: v000001

parameters:
  - name: domain
    title: Domain
    description: >-
      The address this app answers at. Leave it empty to add one later, in the app's
      routing settings.
    type: domain
    optional: true
  - name: jwtSecret
    title: JWT secret
    description: Cryptographic secret for signing auth tokens. Leave empty to generate one.
    type: secret
    generate: {length: 64, charset: hex}
  - name: memoryLimit
    title: Memory limit
    type: size
    default: 1GB
    min: 512MB

dependencies:
  - name: db
    title: Database
    template: mariadb
    version: "11.8"
    params:
      dbName: alexandrie
      username: alexandrie

versions:
  - name: "8.14"
    release: "8.14.2"
    default: true
    components:
      frontend: {image: "ghcr.io/smaug6739/alexandrie-frontend:v8.14.2"}
      backend: {image: "ghcr.io/smaug6739/alexandrie-backend:v8.14.2"}

components:
  - name: frontend
    title: Frontend
    primary: true
    needs: [backend]
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
        resources:
          limits: {memory: "${{ params.memoryLimit }}"}
      settings:
        kind:
          category: webapp
          engine: alexandrie
          version: "${{ version.name }}"
          webapp: {}
        envVars:
          data:
            - {k: PORT, v: "8200"}
            - {k: NUXT_PUBLIC_BASE_API, v: "http://${{ comp.backend.key }}:8201"}
            - {k: NUXT_PUBLIC_BASE_URL, v: "${HIVEPAAS_DOMAIN:+https://$HIVEPAAS_DOMAIN}"}
        routing:
          port: 8200
          exposePublicly: true
          domains:
            - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}

  - name: backend
    title: Backend
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
        resources:
          limits: {memory: "${{ params.memoryLimit }}"}
      settings:
        kind:
          category: webapp
          engine: alexandrie
          version: "${{ version.name }}"
          webapp: {}
        envVars:
          data:
            - {k: BACKEND_PORT, v: "8201"}
            - {k: GIN_MODE, v: release}
            - {k: JWT_SECRET, v: "${{ params.jwtSecret }}"}
            - {k: DATABASE_HOST, v: "${{ deps.db.ref.HIVEPAAS_HOST }}"}
            - {k: DATABASE_PORT, v: "${{ deps.db.ref.HIVEPAAS_PORT }}"}
            - {k: DATABASE_NAME, v: "${{ deps.db.ref.HIVEPAAS_DATABASE_NAME }}"}
            - {k: DATABASE_USER, v: "${{ deps.db.ref.HIVEPAAS_USER }}"}
            - {k: DATABASE_PASSWORD, v: "${{ deps.db.ref.HIVEPAAS_PASSWORD }}"}
            - {k: ALLOW_UNSECURE, v: "true"}
            - {k: FRONTEND_URL, v: "${HIVEPAAS_DOMAIN:+https://$HIVEPAAS_DOMAIN}"}
