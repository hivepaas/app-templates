apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: swetrix
  title: Swetrix
  tagline: Cookieless, privacy-friendly web analytics with error and speed tracking
  description: |
    Swetrix is web analytics that respects privacy: no cookies and no personal data, so no
    consent banner - with traffic, sources, pages, devices, locations, custom events,
    funnels, user flows, real-time visitors, JavaScript error tracking and page-speed
    monitoring, from a script of a few kilobytes.

    **This template creates two apps**

    - **Swetrix**, as four components: an nginx the domain points at, the web app, the
      API - which also receives the events - and a ClickHouse database for them, on a
      volume
    - **a Redis**, named after the app with `-cache` added

    ClickHouse runs inside this app, at the 25.8 release Swetrix is built and tested with.

    **The first start creates the administrator**

    Swetrix lets the first account register even with registration off. This template
    registers the administrator below before the API takes any traffic, and keeps
    registration closed after it.

    **Tracking**

    Add a project, then put its script on your site: it sends events to
    `https://<this app's domain>/backend/log`.

    **Email**

    Password resets and reports need an SMTP server; give it below, or leave it empty.
  categories: [observability/analytics]
  tags: [web-analytics, analytics, privacy, open-source]
  aliases: [web analytics, google analytics alternative, plausible alternative, umami alternative, privacy analytics, cookieless analytics]
  icon: icons/swetrix.png
  links:
    website: https://swetrix.com
    documentation: https://docs.swetrix.com/selfhosting/how-to
    source: https://github.com/Swetrix/swetrix
  license: AGPL-3.0-only
  requires:
    versionCode: v000001

parameters:
  - name: domain
    title: Domain
    description: >-
      The address Swetrix answers at - the dashboard, and the endpoint your sites send events
      to. Leave it empty to add one later, in the routing settings of the gateway component.
    type: domain
    optional: true
  - name: adminEmail
    title: Administrator email
    type: string
    default: admin@example.com
    pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  - name: adminPassword
    title: Administrator password
    description: Used once, when the first start creates the account. Leave empty to generate one; it is kept under the API component's Secrets.
    type: secret
    minLength: 8
    generate: {length: 24}
  - name: secretKeyBase
    title: Secret key base
    description: Signs sign-in tokens. Leave empty to generate one.
    type: secret
    minLength: 32
    generate: {length: 96, charset: hex}
  - name: clickhousePassword
    title: ClickHouse password
    description: The API's password to ClickHouse. Leave empty to generate one.
    type: secret
    minLength: 16
    generate: {length: 48}
  - name: smtpHost
    title: SMTP host
    type: string
    optional: true
  - name: smtpPort
    title: SMTP port
    type: int
    default: 587
    min: 1
    max: 65535
  - name: smtpUser
    title: SMTP username
    type: string
    optional: true
  - name: smtpPassword
    title: SMTP password
    type: secret
    optional: true
  - name: smtpFromEmail
    title: Sender address
    type: string
    default: noreply@example.com
    pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  - name: clickhouseMemoryLimit
    title: ClickHouse memory limit
    type: size
    default: 2GB
    min: 1GB
  - name: dataVolume
    title: Data volume
    description: The volume ClickHouse keeps the events, accounts and projects on.
    type: volume

dependencies:
  - name: cache
    title: Cache
    template: redis
    version: "8.10"

versions:
  - name: "5.4"
    release: "5.4.1"
    default: true
    components:
      gateway: {image: "nginx:1.30.5-alpine"}
      frontend: {image: "swetrix/swetrix-fe:v5.4.1"}
      api: {image: "swetrix/swetrix-api:v5.4.1"}
      # The release Swetrix's own Compose file runs. ClickHouse 26 turns asynchronous
      # inserts on by default, and the API then cannot read back the account it has just
      # written.
      clickhouse: {image: "clickhouse/clickhouse-server:25.8.33.6-alpine"}

components:
  # ── Gateway ────────────────────────────────────────────────────────────
  - name: gateway
    title: Gateway
    primary: true
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
        container:
          healthcheck:
            enabled: true
            mode: CMD-SHELL
            # A server of its own on the loopback: healthy while nginx runs.
            command: wget -q -O /dev/null http://127.0.0.1:8081/
            interval: 30s
            timeout: 5s
            startPeriod: 10s
            retries: 3
        resources:
          limits: {memory: 64MB}
      settings:
        kind: {category: webapp, engine: swetrix, version: "${{ version.name }}", webapp: {}}
        configFiles:
          default.conf:
            # Swetrix's own routes: the API under /backend/, the web app for the rest.
            content: |
              map $http_upgrade $connection_upgrade {
                default upgrade;
                "" close;
              }
              map $http_x_forwarded_proto $forwarded_proto {
                default $http_x_forwarded_proto;
                "" $scheme;
              }

              server {
                listen 80;
                server_name _;
                # Docker's resolver, asked at each request: a component that restarts, or
                # is not up yet, is found again rather than failing nginx's start.
                resolver 127.0.0.11 valid=30s ipv6=off;
                set $api ${{ comp.api.key }}:5005;
                set $frontend ${{ comp.frontend.key }}:3000;

                location /backend/ {
                  rewrite ^/backend/(.*)$ /$1 break;
                  proxy_pass http://$api;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $forwarded_proto;
                proxy_set_header X-Forwarded-Host $host;
                }

                location / {
                  proxy_pass http://$frontend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $forwarded_proto;
                proxy_set_header X-Forwarded-Host $host;
                }

                gzip on;
                gzip_proxied any;
                gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;
              }

              server {
                listen 127.0.0.1:8081;
                location / { return 204; }
              }
            swarmRef:
              file: {name: /etc/nginx/conf.d/default.conf, mode: 444}
        routing:
          port: 80
          exposePublicly: true
          domains:
            - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}

  # ── Frontend ───────────────────────────────────────────────────────────
  - name: frontend
    title: Web app
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
        container:
          healthcheck:
            enabled: true
            mode: CMD-SHELL
            command: wget -q --spider http://127.0.0.1:3000/ping
            interval: 30s
            timeout: 5s
            startPeriod: 20s
            retries: 3
        resources:
          limits: {memory: 512MB}
      settings:
        kind: {category: webapp, engine: swetrix, version: "${{ version.name }}", webapp: {}}
        envVars:
          data:
            - {k: BASE_URL, v: "${${{ comp.gateway.key }}.HIVEPAAS_APP_URL}"}
            # For the pages it renders on the server.
            - {k: API_ORIGIN, v: "http://${{ comp.api.key }}:5005"}

  # ── API ────────────────────────────────────────────────────────────────
  - name: api
    title: API
    needs: [clickhouse]
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
          # The image's own start - ClickHouse's schema, then the server - with the
          # administrator registered beside it.
          command: >-
            sh -c 'npm run clickhouse:initialise &&
            { sh /hivepaas/bootstrap.sh & NODE_ENV=cloud exec node dist/main; }'
        container:
          healthcheck:
            enabled: true
            mode: CMD-SHELL
            # Healthy - and so given traffic - only once the administrator exists: before,
            # anyone reaching it could register first and take that place.
            command: test -f /tmp/hivepaas-ready && wget -q --spider http://127.0.0.1:5005/ping
            interval: 15s
            timeout: 5s
            startPeriod: 120s
            retries: 3
        resources:
          limits: {memory: 1GB}
      settings:
        kind: {category: webapp, engine: swetrix, version: "${{ version.name }}", webapp: {}}
        envVars:
          data:
            - {k: SECRET_KEY_BASE, v: "${secrets.SECRET_KEY_BASE}"}
            - {k: DISABLE_REGISTRATION, v: "true"}
            # Behind the gateway and HivePaaS's router: the visitor's address, which the
            # counts of unique visitors rest on, is in X-Forwarded-For.
            - {k: CLIENT_IP_HEADER, v: x-forwarded-for}
            - {k: CLICKHOUSE_HOST, v: "http://${{ comp.clickhouse.key }}"}
            - {k: CLICKHOUSE_PORT, v: "8123"}
            - {k: CLICKHOUSE_USER, v: swetrix}
            - {k: CLICKHOUSE_PASSWORD, v: "${secrets.CLICKHOUSE_PASSWORD}"}
            - {k: CLICKHOUSE_DATABASE, v: analytics}
            - {k: REDIS_HOST, v: "${{ deps.cache.ref.HIVEPAAS_HOST }}"}
            - {k: REDIS_PORT, v: "${{ deps.cache.ref.HIVEPAAS_PORT }}"}
            - {k: REDIS_PASSWORD, v: "${{ deps.cache.ref.HIVEPAAS_PASSWORD }}"}
            - {k: SMTP_HOST, v: "${{ params.smtpHost }}"}
            - {k: SMTP_PORT, v: "${{ params.smtpPort }}"}
            - {k: SMTP_USER, v: "${{ params.smtpUser }}"}
            - {k: SMTP_PASSWORD, v: "${secrets.SMTP_PASSWORD}"}
            - {k: FROM_EMAIL, v: "${{ params.smtpFromEmail }}"}
            - {k: SWETRIX_ADMIN_EMAIL, v: "${{ params.adminEmail }}"}
            - {k: SWETRIX_ADMIN_PASSWORD, v: "${secrets.ADMIN_PASSWORD}"}
        secrets:
          SECRET_KEY_BASE:
            value: "${{ params.secretKeyBase }}"
          CLICKHOUSE_PASSWORD:
            value: "${{ params.clickhousePassword }}"
          SMTP_PASSWORD:
            value: "${{ params.smtpPassword }}"
          ADMIN_PASSWORD:
            value: "${{ params.adminPassword }}"
        configFiles:
          bootstrap.sh:
            content: |
              # Once the API answers: the administrator's account. Swetrix lets the first account
              # register even with registration off - so it is registered here, before the API is
              # healthy and takes any traffic. A "registration is disabled" answer means it exists.
              until wget -q -O /dev/null http://127.0.0.1:5005/ping; do sleep 2; done
              body=$(node -e 'console.log(JSON.stringify({email: process.env.SWETRIX_ADMIN_EMAIL, password: process.env.SWETRIX_ADMIN_PASSWORD, checkIfLeaked: false}))')
              answer=$(node -e '
              fetch("http://127.0.0.1:5005/v1/auth/register", {method: "POST", headers: {"Content-Type": "application/json"}, body: process.argv[1]})
                .then(async (r) => console.log(r.status, await r.text()))' "$body")
              case "$answer" in
                20[01]*) echo "hivepaas: administrator created" ;;
                *"Registration is disabled"*) ;;
                *) echo "hivepaas: could not create the administrator: $answer" >&2; exit 1 ;;
              esac
              touch /tmp/hivepaas-ready
            swarmRef:
              file: {name: /hivepaas/bootstrap.sh, mode: 444}

  # ── ClickHouse ─────────────────────────────────────────────────────────
  - name: clickhouse
    title: ClickHouse
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
        storage:
          mounts:
            /var/lib/clickhouse: {type: volume, source: "${{ params.dataVolume }}"}
        container:
          healthcheck:
            enabled: true
            mode: CMD-SHELL
            command: wget -q -O /dev/null http://127.0.0.1:8123/ping
            interval: 15s
            timeout: 5s
            startPeriod: 30s
            retries: 5
        resources:
          limits: {memory: "${{ params.clickhouseMemoryLimit }}"}
      settings:
        kind: {category: webapp, engine: swetrix, version: "${{ version.name }}", webapp: {}}
        envVars:
          data:
            - {k: CLICKHOUSE_DB, v: analytics}
            - {k: CLICKHOUSE_USER, v: swetrix}
            - {k: CLICKHOUSE_PASSWORD, v: "${secrets.CLICKHOUSE_PASSWORD}"}
            - {k: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, v: "1"}
        secrets:
          CLICKHOUSE_PASSWORD:
            value: "${{ params.clickhousePassword }}"
        # Swetrix's own ClickHouse settings: fewer logs and system tables, and less memory.
        configFiles:
          reduce-logs.xml:
            content: |
              <clickhouse>
                <logger>
                  <level>warning</level>
                  <console>true</console>
                </logger>
                <query_thread_log remove="remove"/>
                <query_log remove="remove"/>
                <text_log remove="remove"/>
                <trace_log remove="remove"/>
                <metric_log remove="remove"/>
                <asynchronous_metric_log remove="remove"/>
                <session_log remove="remove"/>
                <part_log remove="remove"/>
                <processors_profile_log remove="remove"/>
                <asynchronous_insert_log remove="remove"/>
                <query_metric_log remove="remove"/>
                <opentelemetry_span_log remove="remove"/>
              </clickhouse>
            swarmRef:
              file: {name: /etc/clickhouse-server/config.d/reduce-logs.xml, mode: 444}
          preserve-ram-config.xml:
            content: |
              <clickhouse>
                <mark_cache_size>536870912</mark_cache_size>
                <concurrent_threads_soft_limit_num>1</concurrent_threads_soft_limit_num>
              </clickhouse>
            swarmRef:
              file: {name: /etc/clickhouse-server/config.d/preserve-ram-config.xml, mode: 444}
          disable-user-logging.xml:
            content: |
              <clickhouse>
                <profiles>
                  <default>
                    <log_queries>0</log_queries>
                    <log_query_threads>0</log_query_threads>
                  </default>
                </profiles>
              </clickhouse>
            swarmRef:
              file: {name: /etc/clickhouse-server/users.d/disable-user-logging.xml, mode: 444}
          preserve-ram-user.xml:
            content: |
              <clickhouse>
                <profiles>
                  <default>
                    <max_block_size>2048</max_block_size>
                    <max_download_threads>1</max_download_threads>
                    <input_format_parallel_parsing>0</input_format_parallel_parsing>
                    <output_format_parallel_formatting>0</output_format_parallel_formatting>
                  </default>
                </profiles>
              </clickhouse>
            swarmRef:
              file: {name: /etc/clickhouse-server/users.d/preserve-ram-user.xml, mode: 444}
