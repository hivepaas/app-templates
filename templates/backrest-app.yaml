apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: backrest-app
  title: Backrest for an app
  tagline: Back up another app's files with restic, on a schedule, and browse the snapshots
  description: |
    Backrest - a web interface for restic - set up to back up another app in this project:
    its files on the volume you pick are mounted here, read-only, and backed up on the
    schedule you set to any restic repository - S3, a restic REST server, SFTP.

    **This template sets up**

    - Backrest, on a volume for its configuration, history and restic cache
    - the files the app you pick keeps on the volume you pick, at `/source`, read-only
    - a memory limit you choose

    **After the first deployment**

    Open the app: the first page asks for an instance name and an administrator account.
    Add a repository - the Restic REST Server and Garage templates in this store both make
    one - and a plan with `/source` as its path.

    **Files, not databases**

    It copies files as they are at that moment. That is right for uploads, media and
    documents; a database's data directory copied while it runs may not restore. Back up
    databases with their own dump tools.

    **Restoring**

    `/source` is read-only, so restore a snapshot to Backrest's own volume or download it
    from the snapshot browser, then put the files back - File Browser for an app, in this
    store, can do that part.

    **Keep the repository password**

    restic encrypts every repository with the password you give when adding it, and nothing
    can be restored without it. Keep a copy outside this app.
  categories: [storage/backup]
  tags: [backup, open-source]
  aliases: [restic, backup app, snapshots, restore]
  icon: icons/backrest.svg
  links:
    website: https://garethgeorge.github.io/backrest/
    documentation: https://garethgeorge.github.io/backrest/introduction/getting-started
    source: https://github.com/garethgeorge/backrest
  license: GPL-3.0-only
  requires:
    versionCode: v000001

parameters:
  - name: domain
    title: Domain
    description: >-
      The address this app answers at. Leave it empty to add one later, in the app's
      routing settings.
    type: domain
    optional: true
  - name: targetApp
    title: App
    description: The app whose files to back up.
    type: app
  - name: targetVolume
    title: The app's volume
    description: The volume that app keeps the files on.
    type: volume
  - name: timezone
    title: Time zone
    description: What the schedules are read in. An IANA name, such as Europe/Amsterdam.
    type: string
    default: UTC
    pattern: '^[A-Za-z0-9_+-]+(/[A-Za-z0-9_+-]+)*$'
  - name: memoryLimit
    title: Memory limit
    description: restic runs inside this app, and large backups want more than the interface does.
    type: size
    default: 1GB
    min: 256MB
  - name: dataVolume
    title: Data volume
    description: The volume Backrest's configuration, history and restic cache are kept on.
    type: volume

versions:
  - name: "1.14"
    release: "1.14.1"
    default: true
    image: garethgeorge/backrest:v1.14.1

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    storage:
      mounts:
        /data: {type: volume, source: "${{ params.dataVolume }}"}
        # The other app's directory on that volume, read-only: a backup has no reason to
        # change what it protects.
        /source:
          type: volume
          source: "${{ params.targetVolume }}"
          sourceApp: {app: "${{ params.targetApp }}"}
    container:
      # The image's entry point is tini, which has to be process 1 to reap the restic
      # processes Backrest starts.
      init: false
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        command: curl -fsS -o /dev/null http://127.0.0.1:9898/
        interval: 20s
        timeout: 5s
        startPeriod: 20s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: webapp
      engine: backrest
      version: "${{ version.name }}"
      webapp: {}
    envVars:
      data:
        # Everything that has to survive a redeployment goes on the one volume.
        - {k: BACKREST_DATA, v: /data/data}
        - {k: BACKREST_CONFIG, v: /data/config/config.json}
        - {k: XDG_CACHE_HOME, v: /data/cache}
        - {k: TMPDIR, v: /tmp}
        - {k: BACKREST_PORT, v: "0.0.0.0:9898"}
        - {k: TZ, v: "${{ params.timezone }}"}
    routing:
      port: 9898
      exposePublicly: true
      domains:
        - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}
