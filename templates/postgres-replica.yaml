apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: postgres-replica
  title: PostgreSQL read replica
  tagline: A second copy of a database, kept current by streaming
  description: |
    This is a standby for a [PostgreSQL](postgres) app that already exists here. It copies
    that database once, then follows it: every change the primary writes arrives over a
    replication connection within milliseconds, and the standby serves it read-only. Use it
    to run reports and exports somewhere other than the database your app depends on, or to
    keep a warm copy on a second server.

    **Prepare the primary first**

    PostgreSQL treats a replication connection as its own kind and will refuse one unless
    `pg_hba.conf` says otherwise - and the image writes no such line. Open a terminal on the
    primary app and run:

    ```
    echo "host replication all all scram-sha-256" >> "$PGDATA/pg_hba.conf"
    psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_reload_conf()"
    ```

    No restart, no downtime. Until it is done this app waits, saying so in its log every ten
    seconds, and starts by itself once the primary accepts it.

    **The version and the variant have to match**

    Streaming replication copies the data files themselves, so the standby must be the same
    major version as the primary - 18 follows 18, never 17 - and the same variant, since an
    extension the primary has is a file the standby is expected to have too.

    **Reading from it**

    Other apps reach it at this app's name on port 5432. The user name, the password and the
    database name are the primary's: there is one set of accounts, copied along with
    everything else. So an app that reads here is configured with
    `${<this app>.HIVEPAAS_HOST}` and the primary's `HIVEPAAS_USER` and `HIVEPAAS_PASSWORD`.

    Every connection is read-only. An `INSERT` fails with "cannot execute INSERT in a
    read-only transaction", which is the standby doing its job.

    **What it costs the primary: nothing on the write path**

    Replication here is asynchronous, which is PostgreSQL's default and what this template
    leaves in place. A transaction on the primary commits when the primary's own disk has
    it; nothing waits for this standby to confirm anything, and a standby that is slow,
    unreachable or switched off does not hold up a single commit. `pg_stat_replication`
    shows it as `async`, and `synchronous_standby_names` is empty.

    What the primary does spend is one process sending the changes and the bandwidth to
    carry them - both small next to the work that produced the changes in the first place.

    Nor does this standby create a replication slot, and that is deliberate. A slot would
    guarantee the standby can always catch up, by making the primary keep every WAL file
    until it does - which is exactly how a forgotten standby fills a primary's disk and
    stops it. Nothing this template creates can harm the database it follows.

    **Watching it keep up**

    On the primary, `SELECT client_addr, state, replay_lag FROM pg_stat_replication;` shows
    this standby and how far behind it is. On the standby,
    `SELECT now() - pg_last_xact_replay_timestamp();` says the same thing from its own side.
    That second one is worth a look now and then, because of what comes next.

    **When replication breaks**

    Stopped and started again, or a network that came back: the standby resumes on its own
    and catches up. Nothing to do.

    Away long enough that the primary has recycled the WAL it still needed, though, and it
    cannot resume at all - `requested WAL segment ... has already been removed`, retried
    every five seconds, forever. The fix is to build it again: delete this app along with
    its data, and create it from this template once more.

    **The trap is that a stuck standby looks fine.** It keeps answering queries and it keeps
    passing its health check, because it is still a working database - serving exactly what
    it held when the stream broke. Only the lag says otherwise, which is why it is the thing
    to watch. Query it, alert on it, or read it in the app's terminal; nothing here will
    tell you on its own.

    If you would rather the primary held the WAL than have to rebuild, make a slot for this
    standby and give the primary a limit that protects it:

    ```
    -- on the primary
    SELECT pg_create_physical_replication_slot('standby1');
    ALTER SYSTEM SET max_slot_wal_keep_size = '10GB';
    SELECT pg_reload_conf();
    -- on this standby, then restart the app
    ALTER SYSTEM SET primary_slot_name = 'standby1';
    ```

    The limit is what keeps the trade honest: the primary keeps up to 10GB of WAL for a
    standby that is behind, and abandons it rather than itself beyond that.

    **What happens when the primary dies**

    Nothing automatic. This is replication, not failover: no election, no promotion, nothing
    that moves the name your apps connect to. Making this one the primary is a decision you
    take, with `SELECT pg_promote();` in a terminal here - after which it is a separate
    database that no longer follows anything, every app that used the old primary has to be
    pointed at it, and building a standby again means starting one from scratch.

    **It is not a backup**

    A standby copies everything faithfully, including the `DELETE` you regret. For getting
    yesterday back, use a backup repository on the primary's volume. A replica answers a
    different question: what happens when the *machine* is lost.

    **The first copy takes as long as the database is large**

    Nothing answers until `pg_basebackup` has finished, and the health check allows about
    twenty minutes for it. A primary large enough to need longer needs a longer start period
    in this app's container settings, or the copy will be interrupted and started again.
  categories: [databases/sql]
  tags: [sql, relational, open-source]
  aliases: [replica, standby, streaming replication, read replica, hot standby]
  icon: icons/postgres.svg
  links:
    website: https://www.postgresql.org
    documentation: https://www.postgresql.org/docs/current/warm-standby.html
    source: https://github.com/postgres/postgres
  license: PostgreSQL
  requires:
    versionCode: v000001

parameters:
  - name: primaryApp
    title: Primary app key
    description: >-
      The key of the PostgreSQL app in this environment to follow. Not its title: the key is
      what the app answers to on the project's network, and it is shown on that app's page.
    type: string
    default: postgres
    pattern: '^[a-z0-9][a-z0-9_]{0,99}$'
  - name: memoryLimit
    title: Memory limit
    description: >-
      What the standby gets. Reads here cost what they cost on the primary, so size it for
      the queries you intend to move over.
    type: size
    default: 1GB
    min: 256MB
  - name: dataVolume
    title: Data volume
    description: >-
      The volume the copy is kept on. It holds the whole database, so plan for the size of
      the primary's.
    type: volume

variants:
  - name: alpine
    title: Alpine
    description: A smaller image, based on musl libc
    default: true
  - name: debian
    title: Debian
    description: Based on glibc, for extensions built against it

versions:
  - name: "18"
    release: "18.6"
    default: true
    images:
      alpine: postgres:18.6-alpine3.24
      debian: postgres:18.6-trixie
  - name: "17"
    release: "17.11"
    images:
      alpine: postgres:17.11-alpine3.24
      debian: postgres:17.11-trixie
    override:
      app:
        deployment:
          storage:
            mounts:
              # Before 18, the image keeps its data directly in /var/lib/postgresql/data.
              /var/lib/postgresql: null
              /var/lib/postgresql/data: {type: volume, source: "${{ params.dataVolume }}"}
  - name: "16"
    release: "16.15"
    images:
      alpine: postgres:16.15-alpine3.24
      debian: postgres:16.15-trixie
    override:
      app:
        deployment:
          storage:
            mounts:
              /var/lib/postgresql: null
              /var/lib/postgresql/data: {type: volume, source: "${{ params.dataVolume }}"}

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
      # The image only sets a database up when its first argument is `postgres`; anything
      # else it runs as given. That is what makes room for pg_basebackup here: seed the data
      # directory from the primary, then hand over to the image's own entry point, which
      # finds a database already there and simply starts it.
      #
      # -R writes standby.signal and the connection string this copy follows afterwards.
      # The loop is for a primary that has not been told to accept replication yet: the
      # description says which line to add, and this waits until it is there.
      command: >-
        sh -c 'if [ ! -s "$PGDATA/PG_VERSION" ]; then mkdir -p "$PGDATA";
        chown -R postgres "$PGDATA"; chmod 700 "$PGDATA";
        until gosu postgres pg_basebackup -D "$PGDATA" -Fp -Xs -R -P
        -d "host=$PRIMARY_HOST port=$PRIMARY_PORT user=$PRIMARY_USER password=$PRIMARY_PASSWORD";
        do echo "waiting for the primary to accept a replication connection"; sleep 10; done;
        fi; exec docker-entrypoint.sh postgres'
    storage:
      mounts:
        # From 18 on, the image declares its volume at /var/lib/postgresql and keeps
        # each major's data in its own directory under it.
        /var/lib/postgresql: {type: volume, source: "${{ params.dataVolume }}"}
    container:
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        # Nothing is listening until the first copy finishes, which is what the long start
        # period is for. A standby that has lost its primary still answers: it serves what
        # it already has, and that is not a reason to restart it.
        #
        # The user and database are named so the probe does not knock as `root`, which the
        # server answers - truthfully, and every thirty seconds - with a FATAL in the log.
        # `postgres` is the database initdb always makes, whatever the primary called its own.
        command: pg_isready -q -U "$PRIMARY_USER" -d postgres
        interval: 30s
        timeout: 10s
        startPeriod: 600s
        retries: 20
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: database
      engine: postgres
      version: "${{ version.name }}"
      # No credentials of its own: the accounts are the primary's, copied with the data.
      # An app reading here takes the host from this app and the rest from the primary.
    envVars:
      data:
        # The primary, by its own name in this environment. Nothing is copied: these follow
        # whatever that app publishes.
        - {k: PRIMARY_HOST, v: "${${{ params.primaryApp }}.HIVEPAAS_HOST}"}
        - {k: PRIMARY_PORT, v: "${${{ params.primaryApp }}.HIVEPAAS_PORT}"}
        - {k: PRIMARY_USER, v: "${${{ params.primaryApp }}.HIVEPAAS_USER}"}
        - {k: PRIMARY_PASSWORD, v: "${${{ params.primaryApp }}.HIVEPAAS_PASSWORD}"}
    routing:
      port: 5432
