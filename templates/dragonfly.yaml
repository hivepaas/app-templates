apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: dragonfly
  title: DragonflyDB
  tagline: A Redis-compatible store that uses every core of the machine
  description: |
    Dragonfly speaks the Redis protocol but is built on a multi-threaded, shared-nothing
    engine. On a machine with several cores it serves far more operations per second than
    a single-threaded Redis, and it holds more data in the same amount of memory.

    Existing Redis clients work unchanged. Most commands are supported; a few - Lua
    scripting corners, modules, some cluster commands - are not, so check the compatibility
    page before moving an application that uses the unusual parts of Redis.

    **This template sets up**

    - a generated password, required on every connection
    - a memory ceiling, with cache-style eviction when it is reached
    - snapshots on a volume, written on a schedule and on shutdown
    - the image's own health check

    Other apps in the same environment reach it with `HIVEPAAS_HOST`, `HIVEPAAS_PORT` (6379)
    and `HIVEPAAS_PASSWORD`: `redis://default:PASSWORD@HOST:6379`.

    **Changing it afterwards**

    The memory ceiling, the eviction rule and the persistence mode live under
    Settings > App Kind once the app exists, and Dragonfly is restarted with whatever they
    say. It has one eviction behaviour rather than Redis's list, so anything but
    `noeviction` there means the same thing: evict the least recently used key when the
    ceiling is reached. Setting persistence to `none` stops the snapshots; the schedule
    itself is an environment variable, `SNAPSHOT_CRON`.

    **Threads and memory**

    Dragonfly refuses to start unless the memory ceiling covers 256MB for every thread it
    runs, so the two settings move together: two threads need at least 512MB, eight need
    2GB. Left to itself it would take one thread per core of the machine, which is why
    this template asks for the number instead of guessing.

    **Persistence**

    Dragonfly writes a snapshot of the whole dataset rather than an append-only log. The
    default schedule here is every 30 minutes, plus one on a clean shutdown, so a crash can
    cost up to half an hour of writes. For a cache that is the right trade; for data you
    cannot lose, use a database.
  categories: [databases/cache]
  tags: [cache, key-value, in-memory, redis-compatible, open-source]
  aliases: [dragonflydb, dfly]
  icon: icons/dragonfly.svg
  links:
    website: https://www.dragonflydb.io
    documentation: https://www.dragonflydb.io/docs
    source: https://github.com/dragonflydb/dragonfly
  license: BUSL-1.1
  requires:
    versionCode: v000001

parameters:
  - name: password
    title: Password
    description: Leave empty to generate one.
    type: secret
    minLength: 12
    generate: {length: 32}
  - name: maxMemory
    title: Memory ceiling
    description: >-
      How much of the container's memory Dragonfly fills with data before it starts
      evicting. At least 256MB per thread, and below the memory limit.
    type: size
    default: 1GB
    min: 256MB
  - name: threads
    title: Threads
    description: >-
      How many cores Dragonfly uses. It reserves 256MB of the memory ceiling per thread,
      so the ceiling must be at least 256MB times this number. More threads mean more
      throughput on a machine that has the cores to spare.
    type: int
    default: 2
    min: 1
    max: 32
  - name: snapshotCron
    title: Snapshot schedule
    description: >-
      An ordinary five-field crontab expression. The snapshot is written to the data
      volume. (Dragonfly rejects other forms with a message about six fields; five is
      what it accepts.)
    type: select
    default: "*/30 * * * *"
    options:
      - {value: "*/30 * * * *", title: "Every 30 minutes"}
      - {value: "*/5 * * * *", title: "Every 5 minutes"}
      - {value: "0 * * * *", title: "Every hour"}
      - {value: "0 3 * * *", title: "Once a day, at 03:00"}
  - name: memoryLimit
    title: Memory limit
    description: The container's hard limit. Keep it above the memory ceiling.
    type: size
    default: 2GB
    min: 512MB
  - name: dataVolume
    title: Data volume
    description: The volume the snapshots are kept on.
    type: volume

versions:
  - name: "1.40"
    release: "1.40.2"
    default: true
    image: ghcr.io/dragonflydb/dragonfly:v1.40.2

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
      # The image runs `dragonfly --logtostderr` with whatever arguments start with a
      # dash, so a shell here has to name the binary itself. That shell is what lets the
      # ceiling, the eviction rule and the persistence mode be read from the variables
      # the app's kind settings publish: edit them under Settings > App Kind and the
      # server is restarted with the new ones. The password stays out of the command and
      # out of `ps` by going in as DFLY_requirepass instead.
      #
      # Dragonfly has one eviction behaviour rather than a list, so the rule is read as
      # the yes-or-no it can answer: anything but `noeviction` means evict.
      command: >-
        sh -c 'set -- --maxmemory="${HIVEPAAS_MAX_MEMORY:-0}"
        --proactor_threads=${{ params.threads }} --dir=/data --dbfilename=dump;
        case "$HIVEPAAS_EVICTION_RULE" in
        noeviction) set -- "$@" --cache_mode=false;;
        *) set -- "$@" --cache_mode=true;;
        esac;
        case "$HIVEPAAS_PERSISTENCE_MODE" in
        none) ;;
        *) set -- "$@" --snapshot_cron="$SNAPSHOT_CRON";;
        esac;
        exec dragonfly --logtostderr "$@"'
    storage:
      mounts:
        /data: {type: volume, source: "${{ params.dataVolume }}"}
    container:
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        # The image's own script, which the port below tells where to connect.
        command: /usr/local/bin/healthcheck.sh
        interval: 10s
        timeout: 5s
        startPeriod: 10s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: cache
      engine: dragonfly
      version: "${{ version.name }}"
      cache:
        password: "${{ params.password }}"
        maxMemory: "${{ params.maxMemory }}"
        # Named as the App Kind screen names them: Dragonfly's cache mode is an
        # approximation of allkeys-lru, and its snapshots are point-in-time dumps.
        evictionRule: allkeys-lru
        persistenceMode: rdb
    envVars:
      data:
        - {k: DFLY_requirepass, v: "${HIVEPAAS_PASSWORD}"}
        - {k: HEALTHCHECK_PORT, v: "6379"}
        # The schedule has no field of its own in the kind settings, so it lives here,
        # where it can still be changed without rebuilding the app.
        - {k: SNAPSHOT_CRON, v: "${{ params.snapshotCron }}"}
    routing:
      port: 6379
