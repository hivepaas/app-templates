apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: onetimesecret
  title: Onetime Secret
  tagline: A link that shows a password once and then destroys it
  description: |
    Paste a password, a key or a token, and you get a link. Whoever opens it sees the secret
    once; the second person to open it sees that it is gone. That is the whole idea, and it
    is a better habit than sending credentials over chat or mail, where they stay in the
    history of every device that synced the conversation.

    **Nothing is kept on disk here**

    Secrets live in the cache created alongside this app, encrypted with the key below, and
    disappear when they are read or when they expire. The application itself has no volume:
    there is nothing to back up, which for this kind of tool is the point.

    **The encryption key is the one thing to keep**

    It is generated when the app is created and it must not change afterwards: secrets
    written with one key cannot be read with another. It is in this app's settings if you
    need to record it somewhere safe.

    **It needs an address before it will serve anything**

    Every page it renders contains links built from the site host, and with no host it
    answers 500 rather than guessing. The parameter below follows the app's domain, so give
    the app a domain when you create it - or set the host by hand to whatever address people
    will actually open.

    **Accounts are optional**

    Anyone who can open the page can create a secret without signing in, which is usually
    what a small team wants. Accounts add a history of what you sent and the ability to
    burn a secret before it is read; sign-up is on the page itself.
  categories: [webapps/security]
  tags: [passwords, privacy, open-source]
  aliases: [password-sharing, secret, privatebin-alternative, share-secret]
  icon: icons/onetimesecret.svg
  links:
    website: https://onetimesecret.com
    documentation: https://docs.onetimesecret.com
    source: https://github.com/onetimesecret/onetimesecret
  license: MIT
  requires:
    versionCode: v000001

dependencies:
  - name: cache
    title: Secret store
    template: valkey
    version: "9.1"

parameters:
  - name: domain
    title: Domain
    description: >-
      The address the links point at. Leave it empty to add one later, in the app's routing
      settings - the links are wrong until it has one.
    type: domain
    optional: true
  - name: siteHost
    title: Site host
    description: >-
      The address the links point at - no scheme, just the host: secrets.example.com. It
      follows the app's domain by default, and the app will not serve a page while it is
      empty.
    type: string
    default: "${HIVEPAAS_DOMAIN}"
  - name: secretKey
    title: Encryption key
    description: >-
      Every secret is encrypted with this. Leave it empty and one is generated; it must not
      change afterwards, or what is already stored cannot be read.
    type: secret
    generate: {length: 64}
  - name: memoryLimit
    title: Memory limit
    description: A Ruby application serving one form.
    type: size
    default: 512MB
    min: 256MB

versions:
  - name: "0.26"
    release: "0.26.12"
    default: true
    image: onetimesecret/onetimesecret:v0.26.12

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    container:
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        # The page it serves; the image has curl.
        command: curl -fsS -o /dev/null http://127.0.0.1:3000/
        interval: 30s
        timeout: 10s
        startPeriod: 45s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: webapp
      engine: onetimesecret
      version: "${{ version.name }}"
      webapp: {}
    envVars:
      data:
        # What the links it generates are built from.
        - {k: HOST, v: "${{ params.siteHost }}"}
        # The reverse proxy terminates TLS, so the links have to say https even
        # though the request arrived here over plain HTTP.
        - {k: SSL, v: "true" }
        - {k: SECRET, v: "${secrets.ONETIME_SECRET_KEY}"}
        # Where the secrets themselves are kept, encrypted, until they are read.
        - {k: REDIS_URL, v: "redis://:${{ deps.cache.ref.HIVEPAAS_PASSWORD }}@${{ deps.cache.ref.HIVEPAAS_HOST }}:${{ deps.cache.ref.HIVEPAAS_PORT }}/0"}
        - {k: RACK_ENV, v: production}
    secrets:
      ONETIME_SECRET_KEY:
        value: "${{ params.secretKey }}"
    routing:
      port: 3000
      exposePublicly: true
      domains:
        - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}
