apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: mastodon
  title: Mastodon
  tagline: Your own server on the fediverse - decentralised social networking
  description: |
    Mastodon is decentralised social networking: people post, follow, boost and reply
    across thousands of independent servers that federate over ActivityPub - Threads, Pixelfed,
    PeerTube and others included - with no algorithm and no ads, and moderation tools for
    the server's own rules.

    **This template creates three apps**

    - **Mastodon**, as four components: an nginx the domain points at, the Rails web app, the
      streaming server for live timelines, and the Sidekiq worker that federates - with
      uploaded media on a volume the web app and the worker share
    - **a PostgreSQL database**, named after the app with `-db` added
    - **a Redis**, named after the app with `-cache` added

    **The local domain is for good**

    Every account's address ends in it - `@alice@<local domain>` - and it cannot change once
    the server has federated. Give it below, and give the gateway the same address as its
    domain.

    **The first start creates the owner**

    The owner account below is created, confirmed and approved on the first start, and
    sign-ups are closed. Open them - to everyone, or with approval - in Administration >
    Server settings > Registrations.

    **Email**

    Confirmations, password resets and notifications need an SMTP server: give it below.
  categories: [webapps/social]
  tags: [chat, privacy, open-source]
  aliases: [fediverse, activitypub, twitter alternative, x alternative, social network, microblogging, toot]
  icon: icons/mastodon.svg
  links:
    website: https://joinmastodon.org
    documentation: https://docs.joinmastodon.org/admin/config/
    source: https://github.com/mastodon/mastodon
  license: AGPL-3.0-only
  requires:
    versionCode: v000001

parameters:
  - name: localDomain
    title: Local domain
    description: >-
      The domain in every account's address, which cannot change later -
      `social.example.com`, and the gateway's domain below too.
    type: string
    default: social.example.com
    pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$'
  - name: domain
    title: Domain
    description: >-
      The address Mastodon answers at - the local domain above. Leave it empty only to add
      it later, in the gateway's routing settings.
    type: domain
    optional: true
  - name: ownerUsername
    title: Owner's username
    type: string
    default: owner
    pattern: '^[a-z0-9_]{1,30}$'
  - name: ownerEmail
    title: Owner's email
    type: string
    default: admin@example.com
    pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  - name: ownerPassword
    title: Owner's password
    description: Used once, when the first start creates the account. Leave empty to generate one; it is kept under the web component's Secrets.
    type: secret
    minLength: 12
    generate: {length: 24}
  - name: secretKeyBase
    title: Secret key base
    description: Signs sessions. Leave empty to generate one.
    type: secret
    minLength: 64
    generate: {length: 128, charset: hex}
  - name: encryptionPrimaryKey
    title: Encryption primary key
    description: >-
      The three encryption values protect data Mastodon encrypts in the database. Leave them
      empty to generate them, keep them with the backups, and never change them.
    type: secret
    minLength: 32
    generate: {length: 32}
  - name: encryptionDeterministicKey
    title: Encryption deterministic key
    type: secret
    minLength: 32
    generate: {length: 32}
  - name: encryptionSalt
    title: Encryption key derivation salt
    type: secret
    minLength: 32
    generate: {length: 32}
  - name: vapidPrivateKey
    title: Web Push private key
    description: >-
      Signs push notifications to browsers and apps, 43 letters and digits; the public key is
      derived from it. Leave empty to generate one.
    type: secret
    minLength: 43
    maxLength: 43
    generate: {length: 43}
  - name: smtpHost
    title: SMTP host
    type: string
    optional: true
  - name: smtpPort
    title: SMTP port
    type: int
    default: 587
    min: 1
    max: 65535
  - name: smtpUser
    title: SMTP username
    type: string
    optional: true
  - name: smtpPassword
    title: SMTP password
    type: secret
    optional: true
  - name: smtpFromEmail
    title: Sender address
    type: string
    default: notifications@example.com
    pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  - name: memoryLimit
    title: Memory limit, web and worker each
    type: size
    default: 1536MB
    min: 768MB
  - name: dataVolume
    title: Media volume
    description: The volume uploaded media, avatars and cached remote media are kept on.
    type: volume

dependencies:
  - name: db
    title: Database
    template: postgres
    version: "17"
    params:
      dbName: mastodon
      username: mastodon
  - name: cache
    title: Redis
    template: redis
    version: "8.10"
    params:
      # It holds Sidekiq's queue: Redis refuses writes when full rather than lose a job.
      evictionPolicy: noeviction

versions:
  - name: "4.7"
    release: "4.7.2"
    default: true
    components:
      gateway: {image: "nginx:1.30.5-alpine"}
      web: {image: "ghcr.io/mastodon/mastodon:v4.7.2"}
      streaming: {image: "ghcr.io/mastodon/mastodon-streaming:v4.7.2"}
      sidekiq: {image: "ghcr.io/mastodon/mastodon:v4.7.2"}

components:
  # ── Gateway ────────────────────────────────────────────────────────────
  - name: gateway
    title: Gateway
    primary: true
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
        container:
          healthcheck:
            enabled: true
            mode: CMD-SHELL
            # A server of its own on the loopback: healthy while nginx runs.
            command: wget -q -O /dev/null http://127.0.0.1:8081/
            interval: 30s
            timeout: 5s
            startPeriod: 10s
            retries: 3
        resources:
          limits: {memory: 64MB}
      settings:
        kind: {category: webapp, engine: mastodon, version: "${{ version.name }}", webapp: {}}
        configFiles:
          default.conf:
            # The streaming API to the streaming server, the rest to the web app.
            content: |
              map $http_upgrade $connection_upgrade {
                default upgrade;
                "" "";
              }
              map $http_x_forwarded_proto $forwarded_proto {
                default $http_x_forwarded_proto;
                "" $scheme;
              }

              server {
                listen 80;
                server_name _;
                # Docker's resolver, asked at each request: a component that restarts, or is not up
                # yet, is found again rather than failing nginx's start.
                resolver 127.0.0.11 valid=30s ipv6=off;
                client_max_body_size 99m;
                set $web ${{ comp.web.key }}:3000;
                set $streaming ${{ comp.streaming.key }}:4000;

                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $forwarded_proto;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_buffering off;
                proxy_read_timeout 1h;

                location ^~ /api/v1/streaming { proxy_pass http://$streaming; }
                location / { proxy_pass http://$web; }
              }

              server {
                listen 127.0.0.1:8081;
                location / { return 204; }
              }
            swarmRef:
              file: {name: /etc/nginx/conf.d/default.conf, mode: 444}
        routing:
          port: 80
          exposePublicly: true
          domains:
            - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}

  # ── Web ────────────────────────────────────────────────────────────────
  - name: web
    title: Web
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
          # The database created or migrated, the owner created once, then the server.
          command: >-
            sh -c '. /hivepaas/env.sh && bundle exec rails db:prepare &&
            bundle exec rails runner /hivepaas/bootstrap.rb &&
            exec bundle exec puma -C config/puma.rb'
        storage:
          mounts:
            /opt/mastodon/public/system: {type: volume, source: "${{ params.dataVolume }}"}
        container:
          healthcheck:
            enabled: true
            mode: CMD-SHELL
            command: curl -s --noproxy localhost localhost:3000/health | grep -q OK
            interval: 30s
            timeout: 5s
            # The first start creates the schema.
            startPeriod: 300s
            retries: 3
        resources:
          limits: {memory: "${{ params.memoryLimit }}"}
      settings:
        kind: {category: webapp, engine: mastodon, version: "${{ version.name }}", webapp: {}}
        envVars:
          data: &env
            - {k: LOCAL_DOMAIN, v: "${{ params.localDomain }}"}
            - {k: RAILS_ENV, v: production}
            - {k: NODE_ENV, v: production}
            # The web app serves uploaded media too, from the volume.
            - {k: RAILS_SERVE_STATIC_FILES, v: "true"}
            - {k: RAILS_LOG_TO_STDOUT, v: enabled}
            - {k: DB_HOST, v: "${{ deps.db.ref.HIVEPAAS_HOST }}"}
            - {k: DB_PORT, v: "${{ deps.db.ref.HIVEPAAS_PORT }}"}
            - {k: DB_USER, v: "${{ deps.db.ref.HIVEPAAS_USER }}"}
            - {k: DB_PASS, v: "${{ deps.db.ref.HIVEPAAS_PASSWORD }}"}
            - {k: DB_NAME, v: "${{ deps.db.ref.HIVEPAAS_DATABASE_NAME }}"}
            - {k: REDIS_HOST, v: "${{ deps.cache.ref.HIVEPAAS_HOST }}"}
            - {k: REDIS_PORT, v: "${{ deps.cache.ref.HIVEPAAS_PORT }}"}
            - {k: REDIS_PASSWORD, v: "${{ deps.cache.ref.HIVEPAAS_PASSWORD }}"}
            - {k: SECRET_KEY_BASE, v: "${secrets.SECRET_KEY_BASE}"}
            - {k: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY, v: "${secrets.ENCRYPTION_PRIMARY_KEY}"}
            - {k: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY, v: "${secrets.ENCRYPTION_DETERMINISTIC_KEY}"}
            - {k: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT, v: "${secrets.ENCRYPTION_SALT}"}
            - {k: VAPID_PRIVATE_KEY, v: "${secrets.VAPID_PRIVATE_KEY}"}
            - {k: SMTP_SERVER, v: "${{ params.smtpHost }}"}
            - {k: SMTP_PORT, v: "${{ params.smtpPort }}"}
            - {k: SMTP_LOGIN, v: "${{ params.smtpUser }}"}
            - {k: SMTP_PASSWORD, v: "${secrets.SMTP_PASSWORD}"}
            - {k: SMTP_FROM_ADDRESS, v: "${{ params.smtpFromEmail }}"}
            - {k: MASTODON_OWNER_USERNAME, v: "${{ params.ownerUsername }}"}
            - {k: MASTODON_OWNER_EMAIL, v: "${{ params.ownerEmail }}"}
            - {k: MASTODON_OWNER_PASSWORD, v: "${secrets.OWNER_PASSWORD}"}
        secrets: &secrets
          SECRET_KEY_BASE:
            value: "${{ params.secretKeyBase }}"
          ENCRYPTION_PRIMARY_KEY:
            value: "${{ params.encryptionPrimaryKey }}"
          ENCRYPTION_DETERMINISTIC_KEY:
            value: "${{ params.encryptionDeterministicKey }}"
          ENCRYPTION_SALT:
            value: "${{ params.encryptionSalt }}"
          # Padded, as Mastodon's own generator writes it.
          VAPID_PRIVATE_KEY:
            value: "${{ params.vapidPrivateKey }}="
          SMTP_PASSWORD:
            value: "${{ params.smtpPassword }}"
          OWNER_PASSWORD:
            value: "${{ params.ownerPassword }}"
        configFiles: &files
          env.sh:
            content: |
              # Sourced before every Mastodon process. The Web Push public key is derived from the
              # private one, which is all the app's Secrets keep.
              VAPID_PUBLIC_KEY=$(ruby -ropenssl -rbase64 -e '
                d = OpenSSL::BN.new(Base64.urlsafe_decode64(ENV.fetch("VAPID_PRIVATE_KEY")), 2)
                point = OpenSSL::PKey::EC::Group.new("prime256v1").generator.mul(d)
                print Base64.urlsafe_encode64(point.to_octet_string(:uncompressed))')
              export VAPID_PUBLIC_KEY
            swarmRef:
              file: {name: /hivepaas/env.sh, mode: 444}
          bootstrap.rb:
            content: |
              # What `tootctl accounts create --role Owner --confirmed --approve` does, with the
              # password given rather than a random one - once, while there is no user; and new
              # sign-ups closed, since anyone could otherwise join.
              unless User.exists?
                # The owner's address is not checked for a mail server, in this process only.
                User.define_singleton_method(:skip_mx_check?) { true }
                user = User.new(
                  email: ENV.fetch('MASTODON_OWNER_EMAIL'),
                  password: ENV.fetch('MASTODON_OWNER_PASSWORD'),
                  agreement: true,
                  role: UserRole.find_by!(name: 'Owner'),
                  bypass_registration_checks: true,
                  account: Account.new(username: ENV.fetch('MASTODON_OWNER_USERNAME'))
                )
                user.save!
                user.mark_email_as_confirmed!
                user.approve!
                Setting.registrations_mode = 'none'
                puts 'hivepaas: owner created, sign-ups closed'
              end
            swarmRef:
              file: {name: /hivepaas/bootstrap.rb, mode: 444}

  # ── Streaming ──────────────────────────────────────────────────────────
  - name: streaming
    title: Streaming
    needs: [web]
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
        container:
          healthcheck:
            enabled: true
            mode: CMD-SHELL
            command: curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q OK
            interval: 30s
            timeout: 5s
            startPeriod: 30s
            retries: 3
        resources:
          limits: {memory: 256MB}
      settings:
        kind: {category: webapp, engine: mastodon, version: "${{ version.name }}", webapp: {}}
        envVars:
          data: *env
        secrets: *secrets

  # ── Sidekiq ────────────────────────────────────────────────────────────
  - name: sidekiq
    title: Sidekiq
    needs: [web]
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
          command: sh -c '. /hivepaas/env.sh && exec bundle exec sidekiq'
        storage:
          mounts:
            /opt/mastodon/public/system: {type: volume, source: "${{ params.dataVolume }}"}
        container:
          healthcheck:
            enabled: true
            mode: CMD-SHELL
            # Upstream's own check: Sidekiq's process, with its concurrency in its name.
            command: ps aux | grep '[s]idekiq 8'
            interval: 30s
            timeout: 5s
            startPeriod: 60s
            retries: 3
        resources:
          limits: {memory: "${{ params.memoryLimit }}"}
      settings:
        kind: {category: webapp, engine: mastodon, version: "${{ version.name }}", webapp: {}}
        envVars:
          data: *env
        secrets: *secrets
        configFiles: *files
