apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: quickwit
  title: Quickwit
  tagline: Search engine for logs and traces, built for cheap storage
  description: |
    Quickwit indexes logs, traces and any other append-only data and searches them with
    sub-second latency, using a fraction of what Elasticsearch needs. It takes OpenTelemetry
    logs and traces natively, speaks a subset of the Elasticsearch API, and can be a Jaeger
    backend.

    **This template sets up**

    - Quickwit with every service in one process - indexer, searcher, metastore, janitor
    - a volume for the indexes and its metastore
    - a memory limit you choose

    **Connecting**

    Other apps use `http://<the app's key>:7280`: the OTLP endpoints under
    `/api/v1/otlp`, the ingest API under `/api/v1/<index>/ingest`, and the Elasticsearch
    compatible API under `/api/v1/_elastic`. The web interface is at the same address.

    **Indexes on a volume, not object storage**

    Quickwit is built to keep its indexes in S3, which is what makes searchers cheap to
    add. A volume works for one node and is what this template uses; the Garage app in
    this store is the S3 to move to when one node is not enough.

    **It has no accounts**

    Anything that reaches it can read and write every index, which is why it takes no
    domain here.
  categories: [databases/search, observability/monitoring]
  tags: [search, full-text, monitoring, open-source]
  aliases: [logs, log search, elasticsearch alternative, traces, otel]
  icon: icons/quickwit.svg
  links:
    website: https://quickwit.io
    documentation: https://quickwit.io/docs/
    source: https://github.com/quickwit-oss/quickwit
  license: AGPL-3.0-only
  requires:
    versionCode: v000001

parameters:
  - name: memoryLimit
    title: Memory limit
    description: Indexing is what uses it; 2 GB is a comfortable floor.
    type: size
    default: 2GB
    min: 1GB
  - name: dataVolume
    title: Data volume
    description: The volume the indexes and the metastore are kept on.
    type: volume

versions:
  - name: "0.9"
    release: "0.9.0"
    default: true
    image: quickwit/quickwit:v0.9.0

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
      # Every service in one process, which is what the image's own configuration is for.
      command: run
    storage:
      mounts:
        /quickwit/qwdata: {type: volume, source: "${{ params.dataVolume }}"}
    container:
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        # The image has bash and neither curl nor wget.
        command: >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/7280 &&
          printf "GET /health/livez HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'
        interval: 20s
        timeout: 5s
        startPeriod: 30s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: database
      engine: quickwit
      version: "${{ version.name }}"
    envVars:
      data:
        - {k: QW_LISTEN_ADDRESS, v: 0.0.0.0}
        - {k: QW_DATA_DIR, v: /quickwit/qwdata}
        # What other nodes would be told to reach this one at, if there were any.
        - {k: QW_ADVERTISE_ADDRESS, v: "${HIVEPAAS_HOST}"}
    routing:
      port: 7280
