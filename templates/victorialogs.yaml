apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: victorialogs
  title: VictoriaLogs
  tagline: A log database that stores a lot in little space and queries it fast
  description: |
    VictoriaLogs stores logs from anything that ships them - Vector, Fluent Bit, Promtail,
    the OpenTelemetry Collector, syslog - and searches them with LogsQL, from its own web
    interface or from Grafana. It compresses hard and needs no schema, so every field of a
    structured log is searchable without setting anything up.

    **This template sets up**

    - VictoriaLogs, on a volume for its data
    - a retention period, after which old days are dropped
    - a cap on disk use, past which the oldest days are dropped early
    - a memory limit you choose

    **Sending logs**

    Other apps in the project send to `http://<the app's key>:9428`: `/insert/jsonline` for
    JSON lines, `/insert/loki/api/v1/push` for anything that speaks Loki, and
    `/insert/opentelemetry/v1/logs` for OTLP. The web interface is at `/select/vmui`.

    **The password is optional, and off by default**

    Set a user name below and every HTTP endpoint asks for it - which is what to do before
    giving this app a domain. Left empty, anything on the project's private network may
    write and read, and whatever ships logs needs no credentials.

    **No health check**

    The image is one static binary with nothing else in it, so there is nothing to run a
    check with.
  categories: [observability/monitoring]
  tags: [monitoring, search, open-source]
  aliases: [logs, log management, loki alternative, elk alternative, logsql]
  icon: icons/victorialogs.svg
  links:
    website: https://victoriametrics.com/products/victorialogs/
    documentation: https://docs.victoriametrics.com/victorialogs/
    source: https://github.com/VictoriaMetrics/VictoriaLogs
  license: Apache-2.0
  requires:
    versionCode: v000001

parameters:
  - name: authUsername
    title: User name
    description: >-
      Turns on basic authentication when it is set; leave it empty for a server anything on
      the project network may read and write.
    type: string
    optional: true
    pattern: '^[A-Za-z0-9._-]{1,64}$'
  - name: authPassword
    title: Password
    description: Goes with the user name. Leave empty to generate one.
    type: secret
    minLength: 12
    generate: {length: 32}
  - name: retention
    title: Retention
    description: How long logs are kept - 7d, 4w, 1y.
    type: string
    default: 30d
    pattern: '^[1-9][0-9]*[dwy]$'
  - name: maxDiskUsage
    title: Disk cap
    description: >-
      The most it may keep on the volume; past it the oldest days are dropped, whatever the
      retention says. Leave some of the volume free.
    type: string
    default: 10GiB
    pattern: '^[1-9][0-9]*(MiB|GiB|TiB)$'
  - name: memoryLimit
    title: Memory limit
    type: size
    default: 512MB
    min: 128MB
  - name: dataVolume
    title: Data volume
    description: The volume the logs are kept on.
    type: volume

versions:
  - name: "1.52"
    release: "1.52.0"
    default: true
    image: victoriametrics/victoria-logs:v1.52.0

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
      # An empty -httpAuth.username leaves authentication off. The password is read from
      # the file the secret below is mounted as, so it is not in the service spec.
      command: >-
        -storageDataPath=/victoria-logs-data
        -retentionPeriod=${{ params.retention }}
        -retention.maxDiskSpaceUsageBytes=${{ params.maxDiskUsage }}
        -httpAuth.username=${{ params.authUsername }}
        -httpAuth.password=file:///etc/victorialogs/auth-password
    storage:
      mounts:
        /victoria-logs-data: {type: volume, source: "${{ params.dataVolume }}"}
    container:
      healthcheck:
        # Nothing in the image can run a check: one static binary, no shell.
        enabled: false
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: database
      engine: victorialogs
      version: "${{ version.name }}"
      database:
        username: "${{ params.authUsername }}"
        password: "${{ params.authPassword }}"
    secrets:
      VL_AUTH_PASSWORD:
        value: "${{ params.authPassword }}"
        swarmRef:
          file: {name: /etc/victorialogs/auth-password, mode: 444}
    routing:
      port: 9428
