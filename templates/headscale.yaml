apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: headscale
  title: Headscale
  tagline: Your own control server for Tailscale clients, with a web console
  description: |
    Headscale is an open implementation of Tailscale's coordination server: the part that
    knows which machines are in your network, hands out addresses, distributes keys and
    tells each client how to reach the others. The clients are Tailscale's own, on every
    platform, pointed at this server instead of at Tailscale's.

    **This template creates three components**

    - **proxy**, the address the domain points at: `/admin` goes to the console, the rest
      to the server
    - **server**, Headscale itself, with its database and keys on a volume
    - **ui**, Headplane, a web console for it: machines, users, ACLs, DNS and keys

    The volume is the backup.

    **It needs a domain, and it is the only address that matters**

    Clients are told where the control server is, so the app must have a domain before it
    is any use: `tailscale up --login-server https://<domain>` on each machine. The address
    is taken from the proxy component's URL, so give it a domain in the deploy dialog or in
    its routing settings and redeploy.

    **Signing in to Headplane**

    The console is at `https://<domain>/admin`. It signs in with a Headscale API key - make
    one in the server component's shell with `headscale apikeys create --expiration 90d`,
    and keep it like a password. Its DNS page shows Headscale's configuration but cannot
    change it: edit the configuration file of the server component instead. Opening
    `/admin/acls` directly fails in this Headplane release; go to it from the menu.

    **The command line**

    Everything can also be done in the server component's shell:

        headscale users create alice
        headscale preauthkeys create --user 1 --expiration 24h
        headscale nodes list

    The key that second command prints is what a client registers with:
    `tailscale up --login-server https://<domain> --authkey <key>`.

    **The MagicDNS suffix is not this app's domain**

    Machines get names under the suffix below - `laptop.tailnet.example.com` - and it must
    be a name you are not otherwise using: if it is the same as the server's domain, the
    clients will resolve the control server to a machine in the tailnet and lose it.

    **Upgrading**

    Headscale refuses to skip a minor version: an app on 0.26 goes to 0.27, then 0.28, then
    0.29, one deployment each. Headplane needs 0.27 or later.

    **Relays**

    Where two machines cannot reach each other directly, traffic is relayed. This template
    uses Tailscale's public relays, which is what the Tailscale clients do anyway and costs
    nothing but the hop. Headscale can run its own relay instead - `derp.server.enabled` in
    the configuration file, and a UDP port published in the server component's network settings.

    **What this is not**

    A Tailscale *client*. Joining a tailnet needs a TUN device, which a Swarm service cannot
    be given, so the machines that join this control server are your own laptops, phones and
    servers - not apps running here.
  categories: [webapps/networking]
  tags: [vpn, networking, privacy, open-source]
  aliases: [tailscale, tailnet, wireguard, mesh-vpn, coordination-server, headplane]
  icon: icons/headscale.svg
  links:
    website: https://headscale.net
    documentation: https://headscale.net/stable/setup/requirements/
    source: https://github.com/juanfont/headscale
  license: BSD-3-Clause
  requires:
    versionCode: v000001

parameters:
  - name: domain
    title: Domain
    description: >-
      Where clients find the control server. This app is not usable without one - it is the
      address every machine is pointed at.
    type: domain
    optional: true
  - name: baseDomain
    title: MagicDNS suffix
    description: >-
      Machines are named under this - laptop.tailnet.example.com. It must not be the server's
      own domain, or clients will lose the control server.
    type: string
    default: "tailnet.example.com"
  - name: cookieSecret
    title: Headplane session secret
    description: Signs Headplane's sessions, 32 characters. Leave empty to generate one.
    type: secret
    minLength: 32
    maxLength: 32
    generate: {length: 32}
  - name: dataVolume
    title: Data volume
    description: >-
      The database of machines, users and keys, and the server's noise key - the identity
      every client has trusted. Headplane keeps its own data beside them.
    type: volume
  - name: memoryLimit
    title: Memory limit
    description: For the server - one Go binary and a SQLite database.
    type: size
    default: 256MB
    min: 128MB

versions:
  - name: "0.29"
    release: "0.29.4"
    default: true
    components:
      proxy: {image: "caddy:2.11.7-alpine"}
      server: {image: "headscale/headscale:v0.29.4"}
      ui: {image: "ghcr.io/tale/headplane:0.7.1"}
  - name: "0.28"
    release: "0.28.0"
    components:
      proxy: {image: "caddy:2.11.7-alpine"}
      server: {image: "headscale/headscale:v0.28.0"}
      ui: {image: "ghcr.io/tale/headplane:0.7.1"}
  - name: "0.27"
    release: "0.27.1"
    components:
      proxy: {image: "caddy:2.11.7-alpine"}
      server: {image: "headscale/headscale:v0.27.1"}
      ui: {image: "ghcr.io/tale/headplane:0.7.1"}
  # Kept for apps on it, which have to go through 0.27 and 0.28 to reach 0.29. Headplane
  # does not work with it.
  - name: "0.26"
    release: "0.26.1"
    deprecated: true
    components:
      proxy: {image: "caddy:2.11.7-alpine"}
      server: {image: "headscale/headscale:v0.26.1"}
      ui: {image: "ghcr.io/tale/headplane:0.7.1"}

components:
  # ── Proxy ──────────────────────────────────────────────────────────────
  - name: proxy
    title: Proxy
    primary: true
    needs: [server, ui]
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
        container:
          healthcheck:
            enabled: true
            mode: CMD-SHELL
            # Caddy's own port, below: whether the others are up is their own checks'.
            command: wget -q -O /dev/null http://127.0.0.1:8081/
            interval: 30s
            timeout: 5s
            startPeriod: 10s
            retries: 3
        resources:
          limits: {memory: 128MB}
      settings:
        kind: {category: webapp, engine: headscale, version: "${{ version.name }}", webapp: {}}
        envVars:
          data:
            - {k: HEADSCALE, v: "http://${{ comp.server.key }}:8080"}
            - {k: HEADPLANE, v: "http://${{ comp.ui.key }}:3000"}
        configFiles:
          Caddyfile:
            content: |
              {
              	admin off
              	auto_https off
              	# The X-Forwarded headers come from HivePaaS's proxy: pass them on.
              	servers {
              		trusted_proxies static private_ranges
              	}
              }

              # For the health check.
              :8081 {
              	respond 200
              }

              :80 {
              	# The console, which lives under /admin.
              	handle /admin* {
              		reverse_proxy {$HEADPLANE}
              	}
              	# Everything else - the clients' control protocol among it - is Headscale's.
              	handle {
              		reverse_proxy {$HEADSCALE}
              	}
              }
            swarmRef:
              file: {name: /etc/caddy/Caddyfile, mode: 444}
        routing:
          port: 80
          exposePublicly: true
          domains:
            - {domain: "${{ params.domain }}", enabled: true, forceHttps: true}

  # ── Server ─────────────────────────────────────────────────────────────
  - name: server
    title: Server
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
          # The image's entry point is the binary itself, so this is the subcommand.
          command: serve
        storage:
          mounts:
            /var/lib/headscale: {type: volume, source: "${{ params.dataVolume }}"}
        container:
          healthcheck:
            enabled: true
            # The image is distroless - one binary, no shell, no HTTP client - so the check
            # is the binary itself, which answers only by talking to the running server over
            # its socket. CMD rather than CMD-SHELL for the same reason.
            mode: CMD
            command: /ko-app/headscale nodes list
            interval: 30s
            timeout: 10s
            startPeriod: 30s
            retries: 5
        resources:
          limits: {memory: "${{ params.memoryLimit }}"}
      settings:
        kind: {category: webapp, engine: headscale, version: "${{ version.name }}", webapp: {}}
        envVars:
          data:
            # Headscale reads HEADSCALE_* over the file, which is how the two values that
            # depend on this installation get in without rewriting the configuration. Its
            # address is the proxy's, which the clients reach it through.
            - {k: HEADSCALE_SERVER_URL, v: "${${{ comp.proxy.key }}.HIVEPAAS_APP_URL}"}
            - {k: HEADSCALE_DNS_BASE_DOMAIN, v: "${{ params.baseDomain }}"}
        configFiles:
          config.yaml:
            content: &headscaleConfig |
              # server_url and dns.base_domain are set from the environment; what is here
              # is what they fall back to and everything that does not change per install.
              server_url: http://127.0.0.1:8080
              listen_addr: 0.0.0.0:8080
              # Metrics and the gRPC endpoint stay on the loopback: the first is for this
              # container, and the second would otherwise be a second way in.
              metrics_listen_addr: 127.0.0.1:9090
              grpc_listen_addr: 127.0.0.1:50443
              grpc_allow_insecure: false

              noise:
                private_key_path: /var/lib/headscale/noise_private.key

              prefixes:
                v4: 100.64.0.0/10
                v6: fd7a:115c:a1e0::/48
                allocation: sequential

              derp:
                # Tailscale's public relays, which its clients use anyway. Turn the embedded
                # server on here to relay through this node instead, and publish its UDP port
                # in the server's network settings.
                server:
                  enabled: false
                urls:
                  - https://controlplane.tailscale.com/derpmap/default
                auto_update_enabled: true
                update_frequency: 24h

              database:
                type: sqlite
                sqlite:
                  path: /var/lib/headscale/db.sqlite

              log:
                format: text
                level: info

              dns:
                magic_dns: true
                base_domain: tailnet.example.com
                # What machines in the tailnet resolve names outside it with. Change it in
                # the server's configuration files if you would rather they used your own.
                nameservers:
                  global:
                    - 1.1.1.1

              # On the data volume rather than under /var/run: the image has no shell to
              # create a directory with, and this one already exists.
              unix_socket: /var/lib/headscale/headscale.sock
              unix_socket_permission: "0770"

              # The ACL policy is kept in the database, where Headplane and `headscale policy
              # set` can change it. Without one, every machine may reach every other.
              policy:
                mode: database
            inheritable: true
            swarmRef:
              file: {name: /etc/headscale/config.yaml, mode: 444}

  # ── Headplane ──────────────────────────────────────────────────────────
  - name: ui
    title: Headplane
    needs: [server]
    app:
      deployment:
        source:
          activeMethod: image
          imageSource: {image: "${{ image }}"}
          # The image's entry point is node itself, and it has no shell: this script
          # starts the server. See the file.
          command: /hivepaas/start.mjs
        storage:
          mounts:
            /var/lib/headplane:
              type: volume
              source: "${{ params.dataVolume }}"
              volumeOptions: {subpath: headplane}
        container:
          healthcheck:
            enabled: true
            mode: CMD
            command: >-
              /nodejs/bin/node -e "fetch('http://127.0.0.1:3000/admin/healthz').then((r) =>
              process.exit(r.ok ? 0 : 1), () => process.exit(1))"
            interval: 30s
            timeout: 10s
            startPeriod: 30s
            retries: 3
        resources:
          limits: {memory: 256MB}
      settings:
        kind: {category: webapp, engine: headscale, version: "${{ version.name }}", webapp: {}}
        envVars:
          data:
            # Headplane reads HEADPLANE_<SECTION>__<KEY> over its configuration file.
            # Both addresses are the proxy's, which the console is reached through.
            - {k: HEADPLANE_SERVER__BASE_URL, v: "${${{ comp.proxy.key }}.HIVEPAAS_APP_URL}"}
            - {k: HEADPLANE_SERVER__COOKIE_SECRET, v: "${secrets.COOKIE_SECRET}"}
            - {k: HEADPLANE_HEADSCALE__URL, v: "http://${{ comp.server.key }}:8080"}
            - {k: HEADPLANE_HEADSCALE__PUBLIC_URL, v: "${${{ comp.proxy.key }}.HIVEPAAS_APP_URL}"}
        secrets:
          COOKIE_SECRET:
            value: "${{ params.cookieSecret }}"
        configFiles:
          config.yaml:
            content: |
              # The addresses and the cookie secret are set from the environment.
              server:
                host: 0.0.0.0
                port: 3000
                base_url: http://localhost:3000
                cookie_secure: true
                data_path: /var/lib/headplane
              headscale:
                url: http://127.0.0.1:8080
                # Read for the DNS and settings pages. Headplane cannot write it: change
                # the server component's copy instead.
                config_path: /etc/headscale/config.yaml
            swarmRef:
              file: {name: /etc/headplane/config.yaml, mode: 444}
          headscale-config.yaml:
            # The same file as the server's, as it is at installation.
            content: *headscaleConfig
            swarmRef:
              file: {name: /etc/headscale/config.yaml, mode: 444}
          start.mjs:
            content: |
              // Headplane refuses an empty address, which the components have while they have
              // no domain: leave such a variable out, so the configuration file's value
              // stands. Then the image's own server.
              for (const name of ['HEADPLANE_SERVER__BASE_URL', 'HEADPLANE_HEADSCALE__PUBLIC_URL']) {
                if (!process.env[name]) delete process.env[name];
              }
              await import('/app/build/server/index.js');
            swarmRef:
              file: {name: /hivepaas/start.mjs, mode: 444}
