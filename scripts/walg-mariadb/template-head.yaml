apiVersion: hivepaas.com/v1
kind: AppTemplate

metadata:
  name: mariadb-managed
  title: MariaDB (managed)
  tagline: MariaDB that HivePaaS archives continuously and restores to any moment
  description: |
    MariaDB, looked after by HivePaaS: its binary logs are archived to object
    storage every minute, so a failure loses about a minute of writes, not
    everything since the last dump.

    **This template sets up**

    - a database, a user, and generated user and root passwords, on a persistent
      data volume
    - binary log archiving with [WAL-G](https://github.com/wal-g/wal-g), encrypted,
      to an S3 repository or cloud storage you choose - or to a volume repository,
      which is only as safe as that volume is apart from the database
    - a nightly base backup with `mariadb-backup`, with retention, and a check that
      the binary logs since have no gap
    - an archive health check every five minutes, and a weekly restore test
      that proves the archive restores
    - restore into a new app, to the latest moment, a time, a restore point you
      named, or a base backup

    The data volume must be pinned to a node. Its engine's settings - where it
    archives, its server arguments, its scripts - are HivePaaS's, and the app's
    settings show them read-only.

    Other apps in the same environment reach it by the app's name on port 3306,
    with the credentials HivePaaS shares as `HIVEPAAS_USER`, `HIVEPAAS_PASSWORD`
    and `HIVEPAAS_DATABASE_NAME`. The root password stays with this app.
  categories: [databases/sql]
  tags: [sql, relational, open-source, mysql-compatible, backup]
  aliases: [mysql, pitr, wal-g]
  icon: icons/mariadb.svg
  links:
    website: https://mariadb.org
    documentation: https://mariadb.com/kb/en/documentation/
    source: https://github.com/MariaDB/server
  license: GPL-2.0
  requires:
    versionCode: v000003
    features: [managed-databases]

parameters:
  - name: dbName
    title: Database name
    type: string
    default: app
    pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$'
  - name: username
    title: Username
    type: string
    default: app
    pattern: '^[A-Za-z_][A-Za-z0-9_]{0,79}$'
  - name: password
    title: Password
    description: Leave empty to generate one.
    type: secret
    minLength: 12
    generate: {length: 32}
  - name: rootPassword
    title: Root password
    description: Leave empty to generate one.
    type: secret
    minLength: 12
    generate: {length: 32}
  - name: memoryLimit
    title: Memory limit
    type: size
    default: 1GB
    min: 256MB
  - name: dataVolume
    title: Data volume
    description: The volume the database files are kept on, pinned to a node.
    type: volume

managed:
  engine: mariadb
  engineApi: 1
  mariadb:
    archiveTimeout: 60s
    baseBackupSchedule: "0 2 * * *"
    retainFull: 7
    restoreTestSchedule: "0 4 * * 0"

artifacts:
  - name: wal-g
    version: 3.0.9
    mountPath: /opt/hivepaas/bin/wal-g
    files:
      amd64:
        url: https://github.com/wal-g/wal-g/releases/download/v3.0.9/wal-g-mysql-20.04-amd64
        sha256: 0fef8a61a9d6d7795a60e82f1adc1f61422dd625eaa9ef8531cd54dddbeb3721
        size: 59276952
      arm64:
        url: https://github.com/wal-g/wal-g/releases/download/v3.0.9/wal-g-mysql-20.04-aarch64
        sha256: a1b08439ecb9580c117123c9851293c1d1e89bd1c35de322de8373ebac82c6da
        size: 55655608

versions:
  - name: "11.8"
    release: "11.8.9"
    default: true
    image: mariadb:11.8.9-noble
  - name: "11.4"
    release: "11.4.13"
    image: mariadb:11.4.13-noble

app:
  deployment:
    source:
      activeMethod: image
      imageSource: {image: "${{ image }}"}
    storage:
      mounts:
        # The server's data directory is /var/lib/mysql/data, a directory of the
        # volume: what HivePaaS keeps beside it - its state, a restore test's copy -
        # would be a database in it.
        /var/lib/mysql: {type: volume, source: "${{ params.dataVolume }}"}
    container:
      healthcheck:
        enabled: true
        mode: CMD-SHELL
        # The server answering on its socket, except while the database is being
        # restored: a base backup takes as long to fetch as it is large.
        command: /opt/hivepaas/bin/walg-entrypoint health
        interval: 10s
        timeout: 5s
        startPeriod: 30s
        retries: 5
    resources:
      limits: {memory: "${{ params.memoryLimit }}"}
  settings:
    kind:
      category: database
      engine: mariadb
      version: "${{ version.name }}"
      database:
        dbName: "${{ params.dbName }}"
        username: "${{ params.username }}"
        password: "${{ params.password }}"
        rootPassword: "${{ params.rootPassword }}"
    envVars:
      data:
        - {k: MARIADB_DATABASE, v: "${HIVEPAAS_DATABASE_NAME}"}
        - {k: MARIADB_USER, v: "${HIVEPAAS_USER}"}
        - {k: MARIADB_PASSWORD, v: "${HIVEPAAS_PASSWORD}"}
        - {k: MARIADB_ROOT_PASSWORD, v: "${HIVEPAAS_ROOT_PASSWORD}"}
        # mysql@localhost, which the unix socket identifies: the account the
        # walg-* scripts reach the server as, run as the owner of the data files.
        - {k: MARIADB_MYSQL_LOCALHOST_USER, v: "1"}
        - {k: MARIADB_MYSQL_LOCALHOST_GRANTS, v: ALL}
